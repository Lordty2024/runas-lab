<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>El pintor que escapó de su cuadro</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
/* =========================================================
   EL PINTOR QUE ESCAPÓ DE SU CUADRO — 35 s, bucle
   Rasgo constante del protagonista: la bufanda roja (y la boina)
   ========================================================= */
const W=1920,H=1080,DUR=35,TAU=Math.PI*2;
const cv=document.getElementById('c'),X=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eo=k=>1-Math.pow(1-k,3);
const ei=k=>k*k*k;
const spring=k=>k<=0?0:1-Math.exp(-5*k)*Math.cos(12*k);
function rng(s){s=s|0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function h2r(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgba(h,a){const[r,g,b]=h2r(h);return`rgba(${r},${g},${b},${a})`}
function shade(h,k,a=1){let[r,g,b]=h2r(h);const T=k>0?255:0,m=Math.abs(k);r=Math.round(r+(T-r)*m);g=Math.round(g+(T-g)*m);b=Math.round(b+(T-b)*m);return`rgba(${r},${g},${b},${a})`}
function poly(c,pts,fill){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(fill){c.fillStyle=fill;c.fill()}}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function cam(c,cx,cy,z){c.setTransform(z,0,0,z,W/2-cx*z,H/2-cy*z)}

/* ---------------- ACUARELA ---------------- */
function deform(pts,lv,amp,R){for(let l=0;l<lv;l++){const o=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];const dx=b[0]-a[0],dy=b[1]-a[1];const g=(R()+R()+R()-1.5)*amp;o.push(a,[(a[0]+b[0])/2-dy*g,(a[1]+b[1])/2+dx*g])}pts=o}return pts}
function wc(c,cx,cy,rx,ry,col,R,layers=6,al=.1,edge=true){
  const n=9,base=[];for(let i=0;i<n;i++){const a=i/n*TAU,k=.82+R()*.36;base.push([Math.cos(a)*rx*k,Math.sin(a)*ry*k])}
  const b2=deform(base,2,.35,R);
  c.save();c.translate(cx,cy);c.fillStyle=col;c.strokeStyle=col;
  for(let L=0;L<layers;L++){const p=deform(b2,2,.3,R);c.globalAlpha=al;c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath();c.fill();
    if(edge&&L===layers-1){c.globalAlpha=Math.min(1,al*1.6);c.lineWidth=1.2;c.stroke()}}
  c.restore();
}

/* ---------------- BRILLO VECTORIAL ---------------- */
function glowStroke(c,build,col,k=1){if(k<=0)return;c.save();c.globalCompositeOperation='lighter';c.lineCap='round';c.lineJoin='round';
  for(const[w,a]of[[20,.05],[11,.11],[5.5,.3],[2.4,.85]]){build();c.lineWidth=w;c.strokeStyle=rgba(col,a*k);c.stroke()}
  build();c.lineWidth=1.1;c.strokeStyle=`rgba(255,255,255,${.75*k})`;c.stroke();c.restore()}

/* ---------------- PRE-RENDERS ---------------- */
const PX=300,PY=170,PW=600,PH=400;
const grain=mk(512,512);{const c=grain.getContext('2d');const id=c.createImageData(512,512);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}c.putImageData(id,0,0)}
const grainPat=X.createPattern(grain,'repeat');

// Cuadro en acuarela
const paintA=mk(PW*2,PH*2);
(function(){const c=paintA.getContext('2d');c.scale(2,2);c.fillStyle='#f5eedf';c.fillRect(0,0,PW,PH);const R=rng(7);
  c.globalCompositeOperation='multiply';
  for(let i=0;i<8;i++)wc(c,R()*PW,30+R()*90,160+R()*90,60+R()*30,'#a9cbe6',R,8,.06);
  for(let i=0;i<5;i++)wc(c,R()*PW,170+R()*30,180,40,'#f3c9a1',R,8,.06);
  wc(c,450,95,42,42,'#f5cf5e',R,10,.1);
  for(let i=0;i<6;i++)wc(c,i*120,235,120,45,'#9aa3d1',R,8,.07);
  for(let i=0;i<6;i++)wc(c,i*130+40,282,140,50,'#93c389',R,8,.08);
  wc(c,160,330,130,30,'#7fb3d8',R,10,.08);
  for(let i=0;i<6;i++)wc(c,i*120,378,140,50,'#c3c277',R,8,.08);
  c.globalCompositeOperation='source-over';
  c.strokeStyle='rgba(110,80,55,.7)';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(482,305);c.quadraticCurveTo(476,270,486,232);c.stroke();
  c.globalCompositeOperation='multiply';
  for(let i=0;i<5;i++)wc(c,465+R()*36,212+R()*26,32,28,'#6e9f5e',R,8,.09);
  c.globalAlpha=.07;c.drawImage(grain,0,0,PW,PH);c.globalAlpha=1;c.globalCompositeOperation='source-over';
})();
function mkCloud(seed){const cc=mk(480,192),c=cc.getContext('2d');const R=rng(seed);c.scale(2,2);for(let i=0;i<5;i++)wc(c,60+R()*120,50+R()*20,40+R()*30,22+R()*10,'#ffffff',R,7,.2);for(let i=0;i<3;i++)wc(c,70+R()*100,70,50,10,'#b9c9e2',R,6,.08);return cc}
const cloud1=mkCloud(21),cloud2=mkCloud(33);

// Estudio
const studio=mk(W*1.5,H*1.5);
(function(){const c=studio.getContext('2d');c.scale(1.5,1.5);
  let g=c.createLinearGradient(0,0,0,760);g.addColorStop(0,'#2b231f');g.addColorStop(1,'#4a3a30');c.fillStyle=g;c.fillRect(0,0,W,760);
  c.fillStyle='rgba(255,225,190,.03)';for(let x=0;x<W;x+=56)c.fillRect(x,0,22,760);
  g=c.createRadialGradient(120,60,40,120,60,1300);g.addColorStop(0,'rgba(255,210,150,.25)');g.addColorStop(1,'rgba(255,210,150,0)');c.fillStyle=g;c.fillRect(0,0,W,760);
  poly(c,[[0,0],[260,0],[760,760],[300,760]],'rgba(255,220,170,.05)');
  // repisa
  c.fillStyle='rgba(0,0,0,.25)';c.fillRect(1130,240,690,14);c.fillStyle='#3a271b';c.fillRect(1120,222,700,18);c.fillStyle='#5a3d2a';c.fillRect(1120,222,700,4);
  let bx=1150;[['#6b3f3a',38,110],['#3f5a6b',30,96],['#7a6a3a',44,120],['#4a3b5c',26,90],['#5c6b4a',34,104]].forEach(([col,w,h])=>{c.fillStyle=col;c.fillRect(bx,222-h,w,h);c.fillStyle='rgba(255,255,255,.08)';c.fillRect(bx+4,232-h,w-8,4);bx+=w+3});
  [[1460,'#8fb3c9'],[1580,'#c9b48f'],[1700,'#9fc98f']].forEach(([x,cl])=>{
    for(let k=0;k<4;k++){c.strokeStyle='#8a6a48';c.lineWidth=4;c.lineCap='round';c.beginPath();c.moveTo(x-10+k*7,205);c.lineTo(x-18+k*12,118-k*6);c.stroke();
      c.fillStyle=['#d8323c','#3b6fd8','#e8b830','#2a2a2a'][k];c.beginPath();c.ellipse(x-18+k*12,112-k*6,4,9,0,0,TAU);c.fill()}
    c.fillStyle=rgba(cl,.35);rrect(c,x-26,150,52,72,8);c.fill();c.fillStyle='rgba(255,255,255,.15)';c.fillRect(x-20,158,6,56)});
  // marco
  c.fillStyle='rgba(0,0,0,.4)';c.fillRect(PX-24,PY-20,PW+80,PH+80);
  const fx=PX-40,fy=PY-40,fw=PW+80,fh=PH+80;
  g=c.createLinearGradient(fx,fy,fx+fw,fy+fh);g.addColorStop(0,'#e0b45a');g.addColorStop(.5,'#9c7030');g.addColorStop(1,'#d8a84c');
  c.fillStyle=g;c.beginPath();c.rect(fx,fy,fw,fh);c.rect(PX,PY,PW,PH);c.fill('evenodd');
  c.strokeStyle='rgba(255,240,190,.6)';c.lineWidth=2;c.strokeRect(fx+2,fy+2,fw-4,fh-4);
  c.strokeStyle='rgba(255,230,160,.45)';c.lineWidth=1.5;c.strokeRect(fx+14,fy+14,fw-28,fh-28);
  c.strokeStyle='rgba(80,50,10,.7)';c.lineWidth=3;c.strokeRect(PX-2,PY-2,PW+4,PH+4);
  c.fillStyle='rgba(255,235,170,.5)';for(let x=fx+30;x<fx+fw-20;x+=30){c.beginPath();c.arc(x,fy+7,2,0,TAU);c.arc(x,fy+fh-7,2,0,TAU);c.fill()}
  [[fx+20,fy+20],[fx+fw-20,fy+20],[fx+20,fy+fh-20],[fx+fw-20,fy+fh-20]].forEach(([x,y])=>{c.fillStyle='#f0cd7a';c.beginPath();c.arc(x,y,9,0,TAU);c.fill();c.fillStyle='#8a5f22';c.beginPath();c.arc(x,y,4,0,TAU);c.fill()});
  // monitor (sombra)
  c.fillStyle='rgba(0,0,0,.28)';rrect(c,1196,376,524,314,16);c.fill();
  // mesa
  g=c.createLinearGradient(0,740,0,H);g.addColorStop(0,'#8c5f3c');g.addColorStop(1,'#3f2718');c.fillStyle=g;c.fillRect(0,740,W,H-740);
  c.fillStyle='#b27d51';c.fillRect(0,740,W,3);
  c.strokeStyle='rgba(30,15,5,.3)';c.lineWidth=2;for(let i=-12;i<=12;i++){c.beginPath();c.moveTo(960+i*95,742);c.lineTo(960+i*240,H);c.stroke()}
  const R=rng(91);c.strokeStyle='rgba(255,220,180,.05)';c.lineWidth=1;for(let i=0;i<140;i++){const y=760+R()*320,x=R()*W;c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+40,y+R()*6,x+80,y-R()*6,x+130,y+R()*4);c.stroke()}
  [[420,900,'#d8323c'],[640,1010,'#3b6fd8'],[1100,960,'#e8b830'],[1680,1020,'#5aa36a'],[860,1050,'#c75b8e']].forEach(([x,y,col])=>{c.fillStyle=rgba(col,.35);c.beginPath();c.ellipse(x,y,26,9,.2,0,TAU);c.fill()});
  // paleta
  c.fillStyle='#c9a27a';c.beginPath();c.ellipse(220,955,160,62,-.1,0,TAU);c.fill();c.fillStyle='#4e311f';c.beginPath();c.ellipse(320,960,22,12,0,0,TAU);c.fill();
  [['#d8323c',130,930],['#3b6fd8',180,915],['#e8b830',235,912],['#5aa36a',290,925],['#f4f1ea',150,980],['#2c3e78',210,990]].forEach(([col,x,y])=>{c.fillStyle=col;c.beginPath();c.ellipse(x,y,15,9,0,0,TAU);c.fill()});
  // tubos
  [[520,830,.3,'#d8323c'],[575,850,-.2,'#3b6fd8']].forEach(([x,y,r,col])=>{c.save();c.translate(x,y);c.rotate(r);c.fillStyle='#ddd';rrect(c,-30,-9,60,18,5);c.fill();c.fillStyle=col;c.fillRect(-8,-9,26,18);c.fillStyle='#555';c.fillRect(30,-5,10,10);c.restore()});
  // monitor
  poly(c,[[1415,668],[1465,668],[1495,770],[1385,770]],'#1f1f25');
  c.fillStyle='#2a2a31';c.beginPath();c.ellipse(1440,772,130,14,0,0,TAU);c.fill();
  c.fillStyle='#141418';rrect(c,1178,358,524,314,16);c.fill();
  c.strokeStyle='rgba(255,255,255,.08)';c.lineWidth=2;rrect(c,1179,359,522,312,16);c.stroke();
  c.fillStyle='rgba(120,200,255,.6)';c.beginPath();c.arc(1440,662,2.5,0,TAU);c.fill();
  c.clearRect(PX,PY,PW,PH);c.clearRect(1200,380,480,270);
})();

// papel (mundo origami)
const paperBg=mk(W,H);
(function(){const c=paperBg.getContext('2d');let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f1e9da');g.addColorStop(.7,'#e9dfcc');g.addColorStop(1,'#ddd0b8');c.fillStyle=g;c.fillRect(0,0,W,H);
  const R=rng(42);c.strokeStyle='rgba(120,100,70,.07)';c.lineWidth=1;for(let i=0;i<2200;i++){const x=R()*W,y=R()*H,a=R()*TAU,l=6+R()*22;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a)*l*.5+R()*4,y+Math.sin(a)*l*.5+R()*4,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke()}
  c.fillStyle='rgba(150,120,80,.10)';c.fillRect(0,785,W,H-785);
  c.strokeStyle='rgba(0,0,0,.1)';c.beginPath();c.moveTo(0,785);c.lineTo(W,785);c.stroke();
  c.strokeStyle='rgba(255,255,255,.6)';c.beginPath();c.moveTo(0,787);c.lineTo(W,787);c.stroke();
  c.strokeStyle='rgba(0,0,0,.035)';c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(W,H);c.moveTo(W,0);c.lineTo(0,H);c.moveTo(W/2,0);c.lineTo(W/2,H);c.moveTo(0,H/2);c.lineTo(W,H/2);c.stroke();
})();

// neón
const neonBg=mk(W,H);
(function(){const c=neonBg.getContext('2d');let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05020f');g.addColorStop(.55,'#1a0838');g.addColorStop(.6,'#2a0b4a');g.addColorStop(1,'#07020f');c.fillStyle=g;c.fillRect(0,0,W,H);
  g=c.createRadialGradient(960,640,0,960,640,900);g.addColorStop(0,'rgba(255,60,180,.35)');g.addColorStop(1,'rgba(255,60,180,0)');c.fillStyle=g;c.fillRect(0,300,W,700)})();

const washC=mk(W,H);{const c=washC.getContext('2d');const R=rng(77);for(let i=0;i<26;i++)wc(c,R()*W,R()*H,300+R()*300,200+R()*200,'#efe6d6',R,7,.13)}
const vign=mk(W,H);{const c=vign.getContext('2d');const g=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=g;c.fillRect(0,0,W,H)}
const scanC=mk(4,6);{const c=scanC.getContext('2d');c.fillStyle='rgba(0,0,0,.2)';c.fillRect(0,4,4,2)}
const scanPat=X.createPattern(scanC,'repeat');

/* =========================================================
   PROTAGONISTA — geometría común, cinco materiales
   ========================================================= */
const COL={body:'#4f9bd0',head:'#f2c29a',scarf:'#d8323c',beret:'#2c3e78',leg:'#3d6596'};
function P(x,y,s=1){return{x,y,s,face:1,sx:1,sy:1,rot:0,walk:0,eye:1,lookY:0,legs:1}}
function heroXform(c,p){c.translate(p.x,p.y);c.rotate(p.rot);c.scale(p.s*p.face*p.sx,p.s*p.sy)}
function legX(p,sd){return sd*9+Math.sin(p.walk+(sd>0?Math.PI:0))*8*p.legs}
function scarfTail(t,n=5){const pts=[];for(let i=0;i<=n;i++){const k=i/n;pts.push([-16-k*36,-58+k*6+Math.sin(t*9-k*3)*5*k])}return pts}
function drawEyes(c,p,col,al){c.fillStyle=col;c.strokeStyle=col;c.globalAlpha=al;
  for(const ex of[6,16]){if(p.eye>.5){c.beginPath();c.ellipse(ex,-82+p.lookY,3.6,4.2,0,0,TAU);c.fill()}else{c.lineWidth=2;c.beginPath();c.arc(ex,-83,3.5,.2,Math.PI-.2);c.stroke()}}c.globalAlpha=1}

function heroWater(c,p,t,al=1){c.save();heroXform(c,p);const R=rng(Math.floor(t*8)*7+3);
  c.lineCap='round';c.strokeStyle=rgba(COL.leg,.55*al);c.lineWidth=7;
  for(const sd of[-1,1]){c.beginPath();c.moveTo(sd*9,-22);c.lineTo(legX(p,sd),0);c.stroke()}
  wc(c,0,-38,22,25,COL.body,R,5,.2*al);
  scarfTail(t).forEach((q,i)=>wc(c,q[0],q[1],7-i*.6,5-i*.4,COL.scarf,R,3,.3*al,false));
  wc(c,0,-58,23,7,COL.scarf,R,4,.3*al);
  wc(c,0,-80,24,24,COL.head,R,5,.22*al);
  wc(c,-3,-101,24,8,COL.beret,R,4,.3*al);
  wc(c,-2,-110,4,4,COL.beret,R,3,.3*al,false);
  drawEyes(c,p,'#2a2230',al);c.restore()}

function clayBall(c,x,y,rx,ry,col,rot=0){c.save();c.translate(x,y);c.rotate(rot);
  const g=c.createRadialGradient(-rx*.35,-ry*.4,Math.min(rx,ry)*.08,0,0,Math.max(rx,ry)*1.05);
  g.addColorStop(0,shade(col,.4));g.addColorStop(.5,col);g.addColorStop(1,shade(col,-.5));
  c.fillStyle=g;c.beginPath();c.ellipse(0,0,rx,ry,0,0,TAU);c.fill();
  c.strokeStyle=shade(col,-.65,.55);c.lineWidth=1.6;c.stroke();
  c.fillStyle='rgba(255,255,255,.38)';c.beginPath();c.ellipse(-rx*.38,-ry*.48,rx*.22,ry*.11,-.5,0,TAU);c.fill();
  c.strokeStyle=shade(col,-.35,.22);c.lineWidth=1;for(let k=0;k<3;k++){c.beginPath();c.arc(rx*.15,ry*.15,Math.min(rx,ry)*(.35+k*.14),3.5,5.0);c.stroke()}
  c.restore()}
function heroClay(c,p,t){c.save();heroXform(c,p);
  for(const sd of[-1,1]){const fx=legX(p,sd);clayBall(c,(sd*9+fx)/2,-11,6.5,13,COL.leg,(fx-sd*9)*-.03)}
  clayBall(c,0,-38,22,25,COL.body);
  scarfTail(t).forEach((q,i)=>clayBall(c,q[0],q[1],7.5-i*.8,6-i*.6,COL.scarf));
  clayBall(c,0,-58,24,8,COL.scarf);
  clayBall(c,0,-80,24,24,COL.head);
  clayBall(c,-3,-101,25,8.5,COL.beret,-.08);clayBall(c,-2,-110,4.5,4.5,COL.beret);
  if(p.eye>.5){for(const ex of[6,16]){clayBall(c,ex,-82,4.6,5,'#f4f1ea');clayBall(c,ex+1.2,-81.5,2.4,2.8,'#1c1820')}}else drawEyes(c,p,'#2a2230',1);
  c.restore()}

function heroOri(c,p,t){c.save();heroXform(c,p);
  for(const sd of[-1,1]){const fx=legX(p,sd);poly(c,[[sd*9-4,-26],[sd*9+4,-26],[fx,0]],sd<0?'#3c6aa8':'#2f5a92')}
  poly(c,[[0,-62],[-24,-38],[0,-18]],'#5b8fd0');poly(c,[[0,-62],[24,-38],[0,-18]],'#3c6aa8');
  const w=Math.sin(t*7)*6;
  poly(c,[[-16,-60],[-52,-58+w],[-38,-50+w*.6]],'#b82a30');poly(c,[[-16,-60],[-38,-50+w*.6],[-18,-52]],'#e0393f');
  poly(c,[[-23,-63],[23,-63],[19,-54],[-20,-53]],'#e0393f');poly(c,[[0,-63],[23,-63],[19,-54],[0,-53.5]],'#c4302f');
  const hd=[[0,-106],[22,-97],[26,-79],[12,-62],[-12,-62],[-26,-79],[-22,-97]];
  poly(c,[hd[0],hd[1],hd[2],hd[3],[0,-62]],'#e2d6bd');poly(c,[hd[0],[0,-62],hd[4],hd[5],hd[6]],'#f6eedd');
  poly(c,[[-27,-97],[20,-113],[25,-98]],'#2c3e78');poly(c,[[-27,-97],[25,-98],[-4,-92]],'#1f2c5a');
  for(const ex of[7,17]){if(p.eye>.5)poly(c,[[ex,-87],[ex+3,-83],[ex,-79],[ex-3,-83]],'#1f1a22');else poly(c,[[ex-3,-83],[ex+3,-83],[ex,-81]],'#1f1a22')}

function padV(t,fs,dur,vol,type='triangle',lp=1400,wet=.5,dets=[-6,6]){fs.forEach(f=>dets.forEach(d=>{const os=AC.createOscillator();os.type=type;os.frequency.value=f;os.detune.value=d;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.4,dur*.3));g.gain.setValueAtTime(vol,t+dur*.6);g.gain.linearRampToValueAtTime(0,t+dur);os.connect(fl);fl.connect(g);out(g,wet);os.start(t);os.stop(t+dur+.05)}))}
const mf=m=>440*Math.pow(2,(m-69)/12);
// instrumentos
const harp=(t,m,v=.09)=>{tone(t,mf(m),{type:'triangle',dur:1.3,vol:v,wet:.55});tone(t,mf(m)*2,{dur:.5,vol:v*.3,wet:.5})};
const bell=(t,m)=>{tone(t,mf(m),{dur:2,vol:.07,wet:.7});tone(t,mf(m)*2.76,{dur:.7,vol:.025,wet:.7})};
const tri=(t,f,d,v)=>tone(t,f,{type:'triangle',dur:d,vol:v,wet:.3});
const tuba=(t,f,d)=>tone(t,f,{type:'sawtooth',dur:d,vol:.2,a:.015,lp:520,lp2:220,wet:.08});
const mar=(t,m,v=.12)=>{tone(t,mf(m),{dur:.32,vol:v,wet:.15});tone(t,mf(m)*4,{dur:.05,vol:v*.25,wet:.1})};
const boing=(t,a=180,b=560,d=.28)=>tone(t,a,{dur:d,vol:.12,f2:b,gl:d*.7,wet:.15});
const splat=t=>{noise(t,{dur:.35,vol:.4,type:'lowpass',f:1400,f2:150,wet:.15});tone(t,140,{dur:.22,vol:.25,f2:45})};
const squish=t=>noise(t,{dur:.12,vol:.12,type:'lowpass',f:600,f2:200,wet:.05});
const sq=(t,f,d,v=.05)=>tone(t,f,{type:'square',dur:d,vol:v,a:.003,wet:.08});
const chipKick=t=>tone(t,180,{type:'square',dur:.12,vol:.1,f2:40});
const chipSnare=t=>noise(t,{dur:.1,vol:.12,type:'highpass',f:1500,wet:.05});
const hat=t=>noise(t,{dur:.035,vol:.05,type:'highpass',f:8000,wet:0});
const coin=t=>{sq(t,mf(83),.07,.06);sq(t+.07,mf(88),.28,.06)};
const jumpBlip=t=>tone(t,280,{type:'square',dur:.15,vol:.05,f2:760,gl:.12,wet:.05});
const bonk=t=>tone(t,220,{type:'square',dur:.1,vol:.07,f2:110});
const arpUp=(t,ms,st)=>ms.forEach((m,i)=>sq(t+i*st,mf(m),.09,.05));
const glitch=t=>{for(let i=0;i<10;i++)sq(t+i*.04,200+Math.random()*1500,.04,.04);noise(t,{dur:.5,vol:.15,f:3000,f2:300,wet:.2})};
const whoosh=(t,d,up=true)=>noise(t,{dur:d,vol:.12,f:up?300:3000,f2:up?3500:250,q:1.5,a:d*.6,wet:.3});
const koto=(t,f,v=.13)=>{tone(t,f*.985,{type:'sawtooth',dur:1.4,vol:v,f2:f,gl:.05,lp:3600,lp2:420,wet:.5});tone(t,f*2,{type:'triangle',dur:.4,vol:v*.25,wet:.4})};
const rustle=(t,d=.2)=>noise(t,{dur:d,vol:.1,f:3500,q:.6,a:.03,wet:.2});
const wood=t=>{tone(t,950,{dur:.07,vol:.12,wet:.2});noise(t,{dur:.04,vol:.06,f:2200})};
const taiko=t=>{tone(t,120,{dur:.5,vol:.28,f2:55,wet:.3});noise(t,{dur:.12,vol:.08,type:'lowpass',f:500})};
const shimmer=(t,d)=>[88,91,93,96,98,100,103].forEach((m,i)=>tone(t+i*d/8,mf(m),{dur:.9,vol:.025,wet:.8}));
const kick=t=>tone(t,150,{dur:.32,vol:.45,f2:42,gl:.12,wet:0});
const snare=t=>{noise(t,{dur:.18,vol:.18,f:1900,q:.8,wet:.25});tone(t,190,{type:'triangle',dur:.09,vol:.08})};
const sawBass=(t,f,d)=>{tone(t,f,{type:'sawtooth',dur:d,vol:.09,lp:700,lp2:250,wet:.05,det:-8});tone(t,f,{type:'sawtooth',dur:d,vol:.09,lp:700,lp2:250,wet:.05,det:8})};
const arpSaw=(t,f)=>tone(t,f,{type:'sawtooth',dur:.16,vol:.035,lp:2600,lp2:700,wet:.35});
const riser=(t,d)=>noise(t,{dur:d,vol:.1,f:400,f2:6000,q:3,a:d*.9,wet:.3});
const impact=t=>{tone(t,90,{dur:1.2,vol:.3,f2:35,wet:.6});noise(t,{dur:.8,vol:.18,type:'lowpass',f:3000,f2:200,wet:.6})};
const piano=(t,f,v=.07)=>{tone(t,f,{type:'triangle',dur:1.8,vol:v,wet:.45});tone(t,f*2,{dur:.7,vol:v*.3,wet:.4});tone(t,f*3,{dur:.18,vol:v*.12,wet:.3})};

const EV=[];const at=(t,fn)=>EV.push([t,fn]);
// A · ACUARELA — arpa y pad etéreo (Fa mayor, lento)
const chA=[[53,57,60,64],[50,53,57,62],[46,50,53,57],[48,52,55,60]];
chA.forEach((ch,i)=>{const t0=i*1.6;at(t0,T=>padV(T,ch.map(mf),1.9,.035,'triangle',1400,.6));at(t0,T=>tri(T,mf(ch[0]-12),1.5,.08))});
for(let i=0;i<25;i++){const tt=.1+i*.2;const ch=chA[Math.min(3,Math.floor(tt/1.6))];const idx=[0,1,2,3,4,3,2,1][i%8];const m=idx===4?ch[0]+24:ch[idx]+12;at(tt,T=>harp(T,m,.09))}
at(1.15,T=>bell(T,84));at(1.4,T=>bell(T,91));
[0,2,4,7,9,12,14].forEach((d,i)=>at(3.6+i*.14,T=>harp(T,72+d,.08)));
[0,3,5,7,10,12,15,17,19,22,24,27,29,31].forEach((d,i)=>at(5.0+i*.1,T=>harp(T,96-d,.07)));
// B · PLASTILINA — oom-pah de tuba y marimba juguetona
at(6.5,T=>splat(T));
const B0=7.0,BT=.47,bassB=[48,43,53,48,55,50,48,43];const C3=[60,64,67],F3=[60,65,69],G3=[59,62,67];const chB=[C3,C3,F3,F3,G3,G3,C3,C3];
for(let b=0;b<9;b++){const tt=B0+b*BT;at(tt,T=>tuba(T,mf(bassB[b%8]-12),.3));chB[b%8].forEach(m=>at(tt+BT/2,T=>mar(T,m,.05)))}
const melB=[72,74,76,79,76,74,72,0,77,76,74,72,74,76,79,84];
for(let i=0;i<18;i++){const m=melB[i%16];if(m)at(B0+i*BT/2,T=>mar(T,m+12,.1))}
for(let i=0;i<5;i++){at(6.5+1.3+i*.66+.1,T=>boing(T));at(6.5+1.3+(i+1)*.66-.08,T=>squish(T))}
at(11.35,T=>boing(T,140,900,.5));at(11.9,T=>{tone(T,900,{dur:.25,vol:.12,f2:200});sq(T+.05,mf(84),.08,.05)});at(11.8,T=>whoosh(T,.7,true));
// C · PIXEL — chiptune 8/16 bits
const lead=[76,79,84,79,76,79,81,79,77,81,84,81,79,76,74,72],lb=[48,48,55,55,53,53,55,55];
for(let i=0;i<24;i++)at(12.5+i*.2,T=>sq(T,mf(lead[i%16]),.16,.05));
for(let i=0;i<12;i++){const tt=12.5+i*.4;at(tt,T=>tri(T,mf(lb[i%8]-12),.35,.16));at(tt,i%2?chipSnare:chipKick);at(tt+.2,hat)}
at(11.95,T=>arpUp(T,[72,76,79,84],.05));
JT.forEach(j=>at(11.9+j,jumpBlip));
[.1,.28,.46].forEach(d=>at(11.9+2.8+d,coin));
at(11.9+4.08,T=>{bonk(T);arpUp(T+.08,[72,76,79,84,88],.06)});
for(let i=0;i<6;i++)at(11.9+5.55+i*.083,T=>sq(T,mf(60+i*4),.1,.06));
at(18.0,glitch);at(18.0,T=>whoosh(T,1.0,false));
// D · ORIGAMI — koto en escala hirajoshi, papel y taiko suave
const kotoS=[62,64,65,69,70,74,76,77,81];
at(18.7,T=>rustle(T,.5));at(19.0,T=>padV(T,[mf(50),mf(57)],5.8,.045,'sine',800,.5));
[[0,4],[.375,5],[.75,6],[1.5,5],[1.875,4],[2.25,3],[3.0,4],[3.375,6],[3.75,8],[4.5,7],[4.875,6],[5.25,5]].forEach(([d,i])=>at(19.2+d,T=>koto(T,mf(kotoS[i]))));
[19.6,20.15,20.65].forEach(tt=>at(tt,T=>rustle(T,.2)));at(21.0,wood);
[21.7,22.45,23.2,23.95].forEach(tt=>at(tt,taiko));
at(22.8,T=>shimmer(T,1.8));at(24.15,T=>whoosh(T,.6,true));
// E · NEÓN — synthwave
at(25.0,impact);
const E0=25.0,EB=.545,eCh=[[57,60,64],[53,57,60],[52,55,60],[50,55,59]],eR=[45,41,48,43];
for(let i=0;i<5;i++)at(E0+i*1.09,T=>padV(T,eCh[i%4].map(mf),1.15,.03,'sawtooth',1500,.4,[-10,10]));
for(let b=0;b<10;b++){const tt=E0+b*EB;at(tt,kick);if(b%2)at(tt,snare);at(tt+EB/2,hat);const ci=Math.floor(b/2)%4;
  at(tt,T=>sawBass(T,mf(eR[ci]-12),.25));at(tt+EB/2,T=>sawBass(T,mf(eR[ci]),.22));
  for(let s=0;s<4;s++){const ch=eCh[ci];at(tt+s*EB/4,T=>arpSaw(T,mf(ch[s%3]+12+(s===3?12:0))))}}
at(26.8,T=>riser(T,2.2));at(29.3,T=>riser(T,.9));
// F · FINAL — fusión de todos los timbres, resolución en Do mayor
at(30.5,T=>shimmer(T,.8));
const fCh=[[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]],fT=[30.6,31.4,32.2,32.8];
fCh.forEach((ch,i)=>{at(fT[i],T=>padV(T,ch.map(mf),i<3?.9:.7,.03,'triangle',1600,.6));ch.forEach((m,j)=>at(fT[i]+j*.1,T=>piano(T,mf(m+12),.07)))});
at(31.5,T=>[72,76,79].forEach((m,i)=>mar(T+i*.12,m+12,.08)));
at(31.9,T=>arpUp(T,[84,88,91,96],.06));
at(32.3,T=>[74,77,81].forEach((m,i)=>koto(T+i*.1,mf(m),.09)));
at(32.7,T=>padV(T,[mf(72),mf(79)],.8,.02,'sawtooth',2500,.6,[-12,12]));
at(33.4,T=>{[36,48,55,60,64,67,72].forEach(m=>piano(T,mf(m),.06));padV(T,[48,55,64,72].map(mf),1.5,.035,'triangle',1800,.7)});
[0,4,7,12,16,19,24].forEach((d,i)=>at(33.45+i*.08,T=>harp(T,72+d,.05)));
EV.sort((a,b)=>a[0]-b[0]);
function schedule(){if(!audioOn)return;const e=now(),until=e+.25;if(until-schedTo>1.5)schedTo=e;
  for(let L=Math.floor(schedTo/DUR);L<=Math.floor(until/DUR);L++){for(const[et,fn]of EV){const ab=L*DUR+et;if(ab>=schedTo&&ab<until){try{fn(aT0+ab)}catch(err){}}}}
  schedTo=until}
initAudio();

/* =========================================================
   BUCLE PRINCIPAL
   ========================================================= */
function render(t){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';X.imageSmoothingEnabled=true;
  if(t<12.5)renderStudio(t);
  else if(t<18)renderPixFull(t);
  else if(t<25){renderOri(t);if(t<19.5)renderShatter(t)}
  else if(t<30.5)renderNeon(t);
  else renderFinale(t);
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  let wa=0;if(t<.6)wa=1-seg(t,0,.6);if(t>34.35)wa=seg(t,34.35,35);
  if(wa>0){X.globalAlpha=wa;X.drawImage(washC,0,0);X.globalAlpha=1;X.fillStyle=`rgba(240,232,216,${Math.pow(wa,2.2)})`;X.fillRect(0,0,W,H)}
  X.drawImage(vign,0,0);
  const ox=Math.floor(Math.random()*512),oy=Math.floor(Math.random()*512);X.setTransform(1,0,0,1,-ox,-oy);X.globalAlpha=.04;X.fillStyle=grainPat;X.fillRect(ox,oy,W,H);X.globalAlpha=1;X.setTransform(1,0,0,1,0,0)}
function frame(){const e=now();const t=((e%DUR)+DUR)%DUR;schedule();render(t);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
