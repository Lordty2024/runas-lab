<style>
  :root{--or:#ff7a1a;--bg:#000;--fg:#fff}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;
    font-family:Montserrat,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);background:#000}

  #ui.hide{opacity:0;pointer-events:none}
  #ui button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;
    border-radius:999px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.04em;padding:0 6px}
  #ui button:hover{color:var(--or)}
  #ui button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
  #ui svg{width:16px;height:16px;fill:currentColor}
  #bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.15);cursor:pointer;position:relative;min-width:60px}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--or);box-shadow:0 0 10px rgba(255,122,26,.7)}
  #time{font-size:11px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7);white-space:nowrap}
  #bSound.on{color:var(--or)}
  @media (max-width:480px){#time{display:none}#bSound span{display:none}}
</style>

  last=performance.now();requestAnimationFrame(frame)}
start();
