<script>
'use strict';const $=s=>document.querySelector(s), back=$('#back'),front=$('#front'),b=back.getContext('2d'),f=front.getContext('2d');let start=performance.now(),elapsed=0,lastLoop=-1;const W=1600,H=900,TAU=Math.PI*2;function resize(){let d=Math.min(devicePixelRatio||1,2),w=$('#stage').clientWidth;for(let c of [back,front]){c.width=w*d;c.height=w*d*9/16;c.getContext('2d').setTransform(c.width/W,0,0,c.height/H,0,0)}}new ResizeObserver(resize).observe($('#stage'));const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},win=(t,a,b,c,d)=>smooth((t-a)/(b-a))*(1-smooth((t-c)/(d-c)));let seed=27;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}const dust=Array.from({length:250},()=>({x:rand()*W,y:rand()*H,r:.5+rand()*2.3,v:rand(),p:rand()*TAU}));const petals=Array.from({length:32},(_,i)=>({x:200+rand()*1200,y:170+rand()*480,s:12+rand()*26,p:rand()*TAU,k:i%3}));
function petal(ctx,x,y,size,a,alpha){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.globalAlpha=alpha;let g=ctx.createLinearGradient(-size,0,size,0);g.addColorStop(0,'#6c354c');g.addColorStop(.5,'#edb7bf');g.addColorStop(1,'#f9d8ad');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-size,0);ctx.bezierCurveTo(-size,-size*.85,size*.75,-size*.8,size,0);ctx.bezierCurveTo(size*.3,size*.8,-size*.6,size*.55,-size,0);ctx.fill();ctx.strokeStyle='#f6d5ac';ctx.lineWidth=.6;ctx.stroke();ctx.restore()}
function butterfly(x,y,s,t,a){f.save();f.translate(x,y);f.rotate(Math.sin(t)*.3);f.scale(Math.max(.15,Math.abs(Math.sin(t*5))),1);for(let side of [-1,1]){f.save();f.scale(side,1);f.globalAlpha=a;let g=f.createLinearGradient(0,0,s,0);g.addColorStop(0,'#f9dca1');g.addColorStop(1,'#bd738e');f.fillStyle=g;f.shadowColor='#e2b080';f.shadowBlur=12;f.beginPath();f.moveTo(0,0);f.bezierCurveTo(s*.4,-s*1.3,s*1.5,-s,s*.95,-s*.25);f.bezierCurveTo(s*1.3,s*.65,s*.35,s*.8,0,0);f.fill();f.strokeStyle='#ffe4b7';f.lineWidth=.7;f.stroke();f.restore()}f.globalAlpha=a;f.strokeStyle='#fff0c9';f.beginPath();f.moveTo(0,-s*.25);f.lineTo(0,s*.4);f.stroke();f.restore()}
function draw(now){elapsed=(now-start)/1000;let t=elapsed%20;for(let c of [b,f])c.clearRect(0,0,W,H);let reveal=smooth(t/2),final=smooth((t-12)/3);let glow=b.createRadialGradient(820,380,20,800,440,650);glow.addColorStop(0,'rgba(111,67,62,'+(.24*reveal)+')');glow.addColorStop(.5,'rgba(65,45,34,.12)');glow.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=glow;b.fillRect(0,0,W,H);
// Soft overhead cone and atmospheric rings.
b.save();b.filter='blur(35px)';let light=b.createLinearGradient(0,0,0,740);light.addColorStop(0,'rgba(238,211,168,.10)');light.addColorStop(1,'rgba(226,174,146,0)');b.fillStyle=light;b.beginPath();b.moveTo(740,-100);b.lineTo(1090,740);b.lineTo(490,740);b.lineTo(860,-100);b.fill();b.restore();
let flourish=win(t,2,5,14,18);for(let p of dust){let phase=t*.25+p.p,x=p.x+Math.sin(phase)*60,y=(p.y-t*(10+p.v*22)+1800)%900;let gather=win(t,4,7,9,12);let ang=p.p+t*.22;let rad=180+70*Math.sin(p.p*5);x=x*(1-gather)+(800+Math.cos(ang)*rad*1.8)*gather;y=y*(1-gather)+(425+Math.sin(ang)*rad)*gather;b.globalAlpha=(.12+.6*flourish)*(.4+.6*Math.sin(phase)**2);b.fillStyle=p.v>.5?'#edcc88':'#c48e9c';b.beginPath();b.arc(x,y,p.r,0,TAU);b.fill()}b.globalAlpha=1;
for(let i=0;i<petals.length;i++){let p=petals[i],a=win(t,5+i*.04,7+i*.04,11.5,15);let x=p.x+Math.sin(t*.4+p.p)*65,y=p.y-Math.sin(t*.3+p.p)*60;if(p.k===0){for(let j=0;j<6;j++){let an=j*TAU/6+t*.12;petal(b,x+Math.cos(an)*p.s*.65,y+Math.sin(an)*p.s*.65,p.s,an,a*.65)}}else petal(b,x,y,p.s,t*.3+p.p,a*.75)}
for(let i=0;i<7;i++){let a=win(t,8+i*.25,10+i*.2,14,17);butterfly(380+i*137+Math.sin(t*.65+i)*100,440+Math.cos(t*.7+i*1.7)*190,13+i%3*7,t+i,a*.9)}
let x=960-430*final,scale=.94+.09*smooth(t/12)+.13*final,rot=Math.sin(t*.3)*4,sw= .92+.08*Math.cos(t*.42);$('#bottle').setAttribute('transform',`translate(${x} ${490+Math.sin(t*.5)*5}) rotate(${rot}) scale(${scale*sw} ${scale})`);$('#bottle').style.opacity=reveal;$('#pool').setAttribute('cx',x);$('.intro').style.opacity=win(t,.7,2.7,5.5,7.5);$('.intro').style.transform=`translateY(${(1-smooth(t/3))*15}px)`;$('.copy').style.opacity=win(t,13,15.2,18.7,19.8);$('.copy').style.transform=`translateY(${(1-final)*20}px)`;$('.veil').style.opacity=1-win(t,0,1,18.8,20);$('.progress').style.width=t*5+'%';$('.time').textContent=String(Math.floor(t)).padStart(2,'0')+' / 20 s';if(audioOn&&Math.floor(elapsed/20)!==lastLoop){lastLoop=Math.floor(elapsed/20);scheduleMusic(t)}requestAnimationFrame(draw)}requestAnimationFrame(draw);

let ac,master,compressor,reverb,audioOn=false,voices=[];function initAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0;compressor=ac.createDynamicsCompressor();master.connect(compressor);compressor.connect(ac.destination);reverb=ac.createConvolver();let len=ac.sampleRate*2.6,buf=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){let d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}reverb.buffer=buf;let wet=ac.createGain();wet.gain.value=.26;reverb.connect(wet);wet.connect(master)}
function tone(midi,at,dur,vol,type='sine'){let o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();o.type=type;o.frequency.value=440*2**((midi-69)/12);lp.type='lowpass';lp.frequency.value=type==='sawtooth'?1100:6000;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+(type==='sawtooth'?.35:.015));g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(lp);lp.connect(g);g.connect(master);g.connect(reverb);o.start(at);o.stop(at+dur+.1);voices.push(o);o.onended=()=>{o.disconnect();g.disconnect();lp.disconnect();voices=voices.filter(v=>v!==o)}}
function scheduleMusic(offset=0){let origin=ac.currentTime+.06-offset;const chords=[[50,57,60,65],[46,53,57,62],[43,53,58,62],[45,52,55,61],[50,57,60,65]];for(let bar=0;bar<10;bar++){let when=bar*2;if(when<offset)continue;let ch=chords[Math.floor(bar/2)];ch.forEach(n=>{tone(n,origin+when,2.7,.032,'sawtooth');tone(n+.07,origin+when,2.8,.014,'sawtooth')});tone(ch[0]-12,origin+when,1.7,.14,'sine');for(let j=0;j<6;j++)tone(ch[(j+bar)%4]+12,origin+when+j/3,1.2,.055,'triangle')}
const melody=[77,81,79,77,74,72,74,77,76,73,74];melody.forEach((n,i)=>{let at=1+i*1.65;if(at>=offset){tone(n,origin+at,1.6,.095);tone(n+12,origin+at,1,.02)}})}
function stopVoices(){for(let v of voices){try{v.stop()}catch(e){}}voices=[]}$('#sound').onclick=async()=>{if(!ac)initAudio();await ac.resume();audioOn=!audioOn;master.gain.setTargetAtTime(audioOn?+$('#volume').value*.65:0,ac.currentTime,.1);$('#sound').textContent=audioOn?'♫ Sonido ON':'♫ Sonido OFF';$('#sound').setAttribute('aria-pressed',audioOn);if(audioOn){stopVoices();lastLoop=Math.floor(elapsed/20);scheduleMusic(elapsed%20)}else setTimeout(()=>{if(!audioOn)stopVoices()},500)};$('#volume').oninput=()=>{if(ac&&audioOn)master.gain.setTargetAtTime(+$('#volume').value*.65,ac.currentTime,.08)};$('#restart').onclick=()=>{start=performance.now();lastLoop=-1;if(ac)stopVoices()};document.addEventListener('visibilitychange',()=>{if(ac){if(document.hidden)ac.suspend();else ac.resume()}});
