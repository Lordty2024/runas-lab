planation:`Dominas los saludos fundamentales de cortesía en la variedad Quechua Chanka.`,culturalInsight:`Los saludos afianzan la confianza comunitaria desde el primer instante.`},{id:`q_qc_sal_03`,type:`sentence-order`,prompt:`Ordena las palabras para formar la respuesta cortés: "Estoy bien, señor":`,languageId:`quechua-chanka`,category:`saludos`,scrambledWords:[`taytáy`,`kachkani`,`Allillanmi`],correctSentence:`Allillanmi kachkani taytáy`,explanation:`"Allillanmi kachkani" expresa "estoy bien", y "taytáy" es la forma respetuosa y afectuosa de dirigirse a un señor o padre.`,culturalInsight:`El sufijo "-y" al final de tayta indica afecto: "mi padre/señor".`}]},{id:`les_qc_familia`,languageId:`quechua-chanka`,category:`familia`,title:`El Ayllu y el Círculo Familiar`,subtitle:`Nombres y vínculos de afecto en el hogar andino`,level:2,wordIds:[`qc_fam_01`,`qc_fam_02`,`qc_fam_03`,`qc_fam_04`,`qc_fam_05`],xpReward:60,culturalBrief:{concept:`Ayllu y Solidaridad`,title:`El Ayllu: Más allá de la consanguinidad`,content:`El Ayllu no se limita a padres e hijos; es la gran familia ampliada que incluye a la comunidad, los abuelos sabios, las semillas y la tierra fértil que sustenta el bienestar colectivo.`},questions:[{id:`q_qc_fam_01`,type:`multiple-choice`,prompt:`¿Qué palabra define a la familia extendida, comunidad y linaje territorial?`,contextSituation:`En una faena colectiva (minka) todos trabajan para el bien común.`,languageId:`quechua-chanka`,category:`familia`,options:[`Ayllu`,`Wawa`,`Yaku`,`Sara`],correctAnswer:`Ayllu`,explanation:`"Ayllu" es la institución social andina más trascendental, base de la ayuda mutua.`,culturalInsight:`Estar en el Ayllu significa nunca estar solo; las alegrías y las dificultades se comparten.`},{id:`q_qc_fam_02`,type:`pair-matching`,prompt:`Empareja a los miembros de la familia con su denominación en Quechua Chanka:`,languageId:`quechua-chanka`,category:`familia`,pairs:[{native:`Mama`,spanish:`Madre`},{native:`Tayta`,spanish:`Padre / Señor venerable`},{native:`Hatun Mama`,spanish:`Abuela`},{native:`Wawa`,spanish:`Bebé / Criatura`}],explanation:`Conocer los nombres familiares te permite dirigirte con el debido cariño a cada generación.`,culturalInsight:`Los abuelos ("Hatun Tayta" y "Hatun Mama") son considerados las fuentes vivas de la memoria y la ética andina.`}]},{id:`les_qc_alimentos`,languageId:`quechua-chanka`,category:`alimentos`,title:`La Cosecha y los Frutos de la Chacra`,subtitle:`Papas nativas, maíz, agua de vida y el mercado`,level:3,wordIds:[`qc_ali_01`,`qc_ali_02`,`qc_ali_03`,`qc_ali_04`,`qc_ali_05`],xpReward:65,culturalBrief:{concept:`Pachamama y Cosecha`,title:`La comida como sagrada ofrenda de la tierra`,content:`En los Andes la papa y el maíz no son meras mercancías, sino hijas de la Pachamama que requieren cuidado, canto y agradecimiento durante la siembra y la cosecha.`},questions:[{id:`q_qc_ali_01`,type:`multiple-choice`,prompt:`¿Cómo se le llama a la papa deshidratada naturalmente con las heladas de la puna?`,contextSituation:`En la cocina andina se prepara una sustanciosa lawa para el frío.`,languageId:`quechua-chanka`,category:`alimentos`,options:[`Chuño`,`Yaku`,`Sara`,`Kintu`],correctAnswer:`Chuño`,explanation:`El "Chuño" es un logro científico milenario de conservación de alimentos que aún hoy salva de periodos de sequía.`,culturalInsight:`La liofilización de la papa aprovecha la alternancia entre la helada nocturna y la fuerte radiación solar diurna.`},{id:`q_qc_ali_02`,type:`multiple-choice`,prompt:`En Quechua Chanka, ¿cuál es el término para "Agua"? (Recuerda que en Collao se dice "Unu")`,contextSituation:`Tienes sed después de caminar por la chacra y pides agua.`,languageId:`quechua-chanka`,category:`alimentos`,options:[`Yaku`,`Unu`,`Sara`,`Añay`],correctAnswer:`Yaku`,explanation:`En Quechua Chanka (Ayacucho, Huancavelica, Apurímac) el agua se dice "Yaku", mientras que en Cusco-Collao se dice "Unu".`,culturalInsight:`Reconocer estas diferencias dialectales es parte del respeto a la diversidad lingüística del Perú.`},{id:`q_qc_ali_03`,type:`pair-matching`,prompt:`Asocia los términos agrícolas y de mercado con su traducción:`,languageId:`quechua-chanka`,category:`alimentos`,pairs:[{native:`Papa`,spanish:`Papa nativa`},{native:`Sara`,spanish:`Maíz`},{native:`Qhatu`,spanish:`Mercado / Feria`},{native:`Yaku`,spanish:`Agua`}],explanation:`¡Excelente! Estos términos son esenciales para entender la vida campesina y comercial andina.`,culturalInsight:`El Qhatu es un punto de encuentro vivo donde aún perdura el trueque (chhalay).`}]},{id:`les_qc_numeros`,languageId:`quechua-chanka`,category:`numeros`,title:`Contar en Quechua: Del 1 al 5`,subtitle:`El conteo tradicional para la vida diaria`,level:4,wordIds:[`qc_num_01`,`qc_num_02`,`qc_num_03`,`qc_num_04`,`qc_num_05`],xpReward:50,culturalBrief:{concept:`Yupana y Khipu`,title:`El orden matemático andino`,content:`Los pueblos andinos desarrollaron un sistema numérico decimal sumamente exacto, plasmado en los Khipus (cordeles anudados) y la Yupana (ábaco andino de cálculo).`},questions:[{id:`q_qc_num_01`,type:`multiple-choice`,prompt:`¿Cómo se dice el número tres (3) en Quechua?`,languageId:`quechua-chanka`,category:`numeros`,options:[`Kimsa`,`Iskay`,`Huk`,`Pichqa`],correctAnswer:`Kimsa`,explanation:`Kimsa representa el número 3, vinculado a los tres planos de la existencia andina (Hanan, Kay y Uku Pacha).`,culturalInsight:`El tres se visualiza en el kintu de tres hojas de coca que une el corazón, el pensamiento y el trabajo.`},{id:`q_qc_num_02`,type:`pair-matching`,prompt:`Ordena y empareja los números del 1 al 5 en quechua:`,languageId:`quechua-chanka`,category:`numeros`,pairs:[{native:`Huk`,spanish:`1 (Uno)`},{native:`Iskay`,spanish:`2 (Dos)`},{native:`Tawa`,spanish:`4 (Cuatro)`},{native:`Pichqa`,spanish:`5 (Cinco)`}],explanation:`¡Has memorizado la secuencia fundamental de conteo en Runa Simi!`,culturalInsight:`Tawa dio origen al nombre del Tawantinsuyu: las cuatro regiones integradas.`}]},{id:`les_ay_saludos`,languageId:`aymara`,category:`saludos`,title:`Aruntanaka: Saludos del Altiplano`,subtitle:`Iniciando el diálogo con armonía y buena energía`,level:1,wordIds:[`ay_sal_01`,`ay_sal_02`,`ay_sal_03`,`ay_sal_04`,`ay_sal_05`],xpReward:55,culturalBrief:{concept:`Suma Qamaña`,title:`El saludo como apertura del corazón`,content:`En la cultura aimara, saludar al encontrarse en los caminos o en las orillas del lago Titicaca es un acto sagrado que reafirma que todos somos hermanos y hermanas (jilatas y kullakas).`},questions:[{id:`q_ay_sal_01`,type:`multiple-choice`,prompt:`Si alguien te saluda con un cálido "¿Kamisaraki?", ¿cuál es la respuesta tradicional?`,contextSituation:`Caminas por la plaza de Puno y un amigo te pregunta por tu estado.`,languageId:`aymara`,category:`saludos`,options:[`Walikiwa`,`Yuspagara`,`Jikisiñkama`,`Jupha`],correctAnswer:`Walikiwa`,explanation:`"Walikiwa" significa "Estoy bien / Todo marcha con serenidad y bienestar".`,culturalInsight:`El sufijo "-wa" da certeza afirmativa y serenidad a las palabras compartidas.`},{id:`q_ay_sal_02`,type:`multiple-choice`,prompt:`¿Qué significa el saludo matutino "Aski urukipan"?`,languageId:`aymara`,category:`saludos`,options:[`Buenos días (Que sea un buen día)`,`Hasta mañana`,`Buenas noches`,`Muchas gracias`],correctAnswer:`Buenos días (Que sea un buen día)`,explanation:`"Aski" (bueno/noble) + "uru" (día/sol). Es el saludo noble para el amanecer.`,culturalInsight:`Es un deseo sincero de que la luz solar guíe con rectitud las acciones del día.`},{id:`q_ay_sal_03`,type:`pair-matching`,prompt:`Conecta cada expresión en Aimara con su significado correspondiente:`,languageId:`aymara`,category:`saludos`,pairs:[{native:`Kamisaraki`,spanish:`¿Cómo estás?`},{native:`Walikiwa`,spanish:`Estoy bien`},{native:`Yuspagara`,spanish:`Muchas gracias`},{native:`Jikisiñkama`,spanish:`Hasta volver a encontrarnos`}],explanation:`Dominas las fórmulas de cortesía más respetadas en la cultura aimara.`,culturalInsight:`En aimara, "Jikisiñkama" abriga la certeza de que el destino nos reunirá pronto.`}]},{id:`les_ay_familia`,languageId:`aymara`,category:`familia`,title:`Wila Masi: Lazos de Sangre y Comunidad`,subtitle:`Jilatas, kullakas y la sabiduría de los abuelos`,level:2,wordIds:[`ay_fam_01`,`ay_fam_02`,`ay_fam_03`,`ay_fam_04`],xpReward:60,culturalBrief:{concept:`Chacha-Warmi y Respeto a los Mayores`,title:`Los Achachilas y la familia extendida`,content:`Los abuelos (Achachila y Awicha) son la raíz de la identidad. La palabra "Achachila" nombra tanto al abuelo de carne y hueso como a las cumbres nevadas tutelares que vigilan el altiplano.`},questions:[{id:`q_ay_fam_01`,type:`multiple-choice`,prompt:`¿Cómo se le llama con respeto y afecto a una hermana o compañera en Aimara?`,languageId:`aymara`,category:`familia`,options:[`Kullaka`,`Jilata`,`Achachila`,`Uma`],correctAnswer:`Kullaka`,explanation:`"Kullaka" es hermana y el trato cordial para toda mujer de la comunidad.`,culturalInsight:`Fomenta la protección y el respeto mutuo entre todos los integrantes del pueblo.`},{id:`q_ay_fam_02`,type:`pair-matching`,prompt:`Asocia los roles familiares en Aimara:`,languageId:`aymara`,category:`familia`,pairs:[{native:`Jilata`,spanish:`Hermano / Compañero`},{native:`Kullaka`,spanish:`Hermana / Compañera`},{native:`Achachila`,spanish:`Abuelo / Ancestro protector`},{native:`Awicha`,spanish:`Abuela`}],explanation:`Has relacionado con precisión los pilares del tejido familiar aimara.`,culturalInsight:`La transmisión oral de historias de las Awichas al calor del fogón mantiene vivo el idioma.`}]},{id:`les_ay_numeros`,languageId:`aymara`,category:`numeros`,title:`Jakhuwinaka: Números en Aimara (1 al 5)`,subtitle:`Maya, paya, kimsa... Aprende a contar en el Altiplano`,level:3,wordIds:[`ay_num_01`,`ay_num_02`,`ay_num_03`,`ay_num_04`,`ay_num_05`],xpReward:55,culturalBrief:{concept:`Jakhuña (El arte de contar)`,title:`El conteo en las faenas y ferias`,content:`En las ferias altiplánicas de Ilave, Desaguadero y Juliaca, el conteo en aimara es cotidiano para comerciar papas, tejidos de alpaca y quinua.`},questions:[{id:`q_ay_num_01`,type:`multiple-choice`,prompt:`¿Cuál es el número dos (2) en Aimara?`,languageId:`aymara`,category:`numeros`,options:[`Paya`,`Maya`,`Pusi`,`Phisqa`],correctAnswer:`Paya`,explanation:`"Paya" es el número 2 (se abrevia a "Pä" cuando califica a un sustantivo, ej. "Pä jilata").`,culturalInsight:`La dualidad complementaria (Chacha-Warmi) está en el corazón del número dos.`},{id:`q_ay_num_02`,type:`sentence-order`,prompt:`Ordena la secuencia numérica de menor a mayor (1, 2, 3):`,languageId:`aymara`,category:`numeros`,scrambledWords:[`Kimsa`,`Maya`,`Paya`],correctSentence:`Maya Paya Kimsa`,explanation:`Maya (1), Paya (2), Kimsa (3). ¡La base del conteo aimara!`,culturalInsight:`Estos tres primeros números son compartidos con una fonética muy similar en varios idiomas andinos.`}]},{id:`les_ql_saludos`,languageId:`quechua-collao`,category:`saludos`,title:`Saludos y Afecto en Quechua Collao`,subtitle:`Variedad de Cusco y Puno con sus ricas oclusivas`,level:1,wordIds:[`ql_sal_01`,`ql_sal_02`,`ql_ali_01`,`ql_ali_02`,`ql_con_01`],xpReward:60,culturalBrief:{concept:`Qosqo Simi y Fonética Collao`,title:`La riqueza sonora del Quechua Collao`,content:`El Quechua Collao posee consonantes aspiradas (ph, th, kh, qh) y glotalizadas (p', t', k', q') que le otorgan un timbre rítmico y musical inconfundible.`},questions:[{id:`q_ql_sal_01`,type:`multiple-choice`,prompt:`En la ciudad de Cusco, ¿cuál es la expresión más extendida para decir "Muchas gracias"?`,languageId:`quechua-collao`,category:`saludos`,options:[`Añay`,`Sulpayki`,`Yuspagara`,`Walikiwa`],correctAnswer:`Añay`,explanation:`"Añay" es la expresión emblemática de gratitud en la variedad Cusco-Collao.`,culturalInsight:`Mientras en Chanka se prefiere "Sulpayki", en Collao "Añay" florece en todos los diálogos.`},{id:`q_ql_sal_02`,type:`multiple-choice`,prompt:`¿Cómo se dice "Agua" en Quechua Collao?`,langu ado y las aguas vivas.`,audioPhonemes:[`Ay`,`llu`]},{id:`qc_fam_02`,term:`Tayta`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Padre / Señor venerable`,phonetics:`[taj.ta]`,category:`familia`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`MINEDU - Diccionario Chanka`,exampleSentence:{native:`Taytayqa chakratam richkan.`,spanish:`Mi padre se está yendo a la chacra.`,context:`Mención cotidiana de las labores del padre.`},culturalContext:`Término de alto respeto que también se utiliza para hombres mayores y para el Inti (Tayta Inti).`,audioPhonemes:[`Tay`,`ta`]},{id:`qc_fam_03`,term:`Mama`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Madre / Señora venerable`,phonetics:`[ma.ma]`,category:`familia`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`MINEDU - Diccionario Chanka`,exampleSentence:{native:`Mamayqa saratam wayk'uchkan.`,spanish:`Mi madre está cocinando maíz.`,context:`Labores afectuosas del hogar andino.`},culturalContext:`Madre nutricia del hogar y espejo de la Pachamama (Madre Tierra).`,audioPhonemes:[`Ma`,`ma`]},{id:`qc_fam_04`,term:`Wawa`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Bebé / Criatura / Hijo (de la madre)`,phonetics:`[wa.wa]`,category:`familia`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`MINEDU`,exampleSentence:{native:`Wawacha puñuchkan.`,spanish:`El bebito está durmiendo.`,context:`En el arrullo o cuidado en el lliclla.`},culturalContext:`El quechua distingue la relación de maternidad ("wawa") y paternidad ("churi" hijo del padre).`,audioPhonemes:[`Wa`,`wa`]},{id:`qc_fam_05`,term:`Hatun Mama`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Abuela (Madre grande)`,phonetics:`[ha.tun ma.ma]`,category:`familia`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`DIGEIBIRA MINEDU`,exampleSentence:{native:`Hatun mamay willakuykunata willawan.`,spanish:`Mi abuelita me cuenta historias y tradiciones.`,context:`Transmisión oral de saberes ancestrales al atardecer.`},culturalContext:`Las abuelas son las guardianas de las semillas, las hierbas medicinales y la memoria del pueblo.`,audioPhonemes:[`Ha`,`tun`,`Ma`,`ma`]},{id:`qc_ali_01`,term:`Papa`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Papa (tubérculo andino sagrado)`,phonetics:`[pa.pa]`,category:`alimentos`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`MINEDU / Centro Internacional de la Papa`,exampleSentence:{native:`Kay papachaqa ancha miskim.`,spanish:`Esta papita es muy dulce y sabrosa.`,context:`Al probar la cosecha de papa nativa.`},culturalContext:`El Perú alberga más de 3,000 variedades de papas nativas, domesticadas por sabios agricultores andinos.`,audioPhonemes:[`Pa`,`pa`]},{id:`qc_ali_02`,term:`Sara`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Maíz`,phonetics:`[sa.ra]`,category:`alimentos`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`MINEDU - Diccionario Chanka`,exampleSentence:{native:`Sara tipiy punchaw chayamun.`,spanish:`Llegó el día de la cosecha y deshoje del maíz.`,context:`Faena festiva comunal de cosecha.`},culturalContext:`El maíz es símbolo de abundancia y base de la chicha ceremonial (Aqha) y los mates.`,audioPhonemes:[`Sa`,`ra`]},{id:`qc_ali_03`,term:`Chuño`,languageId:`quechua-chanka`,variety:`Ayacucho-Chanka`,translation:`Papa deshidratada por helada natural`,phonetics:`[tʃu.ɲu]`,category:`alimentos`,grammaticalType:`sustantivo`,validationStatus:`VALIDATED`,validationSource:`MINEDU`,exampleSentence:{native:`Chuñu lawata mamay wayk'un.`,spanish:`Mi mamá cocina una sopa espesa de chuño.`,context:`Almuerzo tradicional en época fría.`},culturalContext:`Tecnología precolombina de liofilización natural mediante las heladas nocturnas de la puna y el sol del día.`,audioPhonemes:[`Chu`,`ño`]},{id:`qc_ali_04`,term:`Yaku`,languageId:`quechua-chan
