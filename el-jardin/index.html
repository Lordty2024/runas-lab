<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Jardín de Margot — Animación Poética</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Alex+Brush&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FDFBF7',
              100: '#FAF5EC',
              200: '#F4ECDD',
              300: '#ECE0CA',
            },
            botanical: {
              sage: '#8F9E8B',
              olive: '#5A6B53',
              deepGreen: '#344E41',
              rose: '#E8B4B8',
              lavender: '#C5BAE0',
              peach: '#F7D1BA',
              honey: '#F9E4B7',
              gold: '#D4AF37',
              soil: '#4A3525',
              darkSoil: '#2C1E14'
            }
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            script: ['"Alex Brush"', 'cursive'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Botanical & Poetic Styling */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #EDE8DE;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    /* 9:16 Aspect Ratio Container */
    .animation-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 853px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(ellipse at 50% 20%, #FFFDF9 0%, #FAF5EC 55%, #F2E8D7 100%);
      box-shadow: 0 25px 60px -15px rgba(74, 53, 37, 0.28), 0 0 0 1px rgba(212, 175, 55, 0.2);
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 480px) {
      .animation-wrapper {
        border-radius: 0;
        max-width: 100vw;
        max-height: 100vh;
        box-shadow: none;
      }
    }

    /* Botanical paper texture overlay */
    .paper-texture {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(212, 175, 55, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.7;
      z-index: 2;
    }

    /* Warm Sunlight Vignette */
    .sunlight-beam {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 248, 220, 0.5) 0%, rgba(255, 235, 180, 0.2) 40%, transparent 70%);
      pointer-events: none;
      z-index: 3;
      mix-blend-mode: soft-light;
      animation: warmBreathe 8s ease-in-out infinite alternate;
    }

    @keyframes warmBreathe {
      0% { opacity: 0.6; transform: translateX(-50%) scale(0.95); }
      100% { opacity: 0.95; transform: translateX(-50%) scale(1.05); }
    }

    /* Word badge ethereal glow */
    .word-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 253, 249, 0.88);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.05em;
      transition: opacity 0.8s ease, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 25;
      white-space: nowrap;
    }

    /* Custom range input styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: #D4AF37;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
      margin-top: -5px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(143, 158, 139, 0.3);
      border-radius: 2px;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      background: rgba(44, 30, 20, 0.55);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>

  <!-- Main Animation Container 9:16 -->
  <div class="animation-wrapper" id="mainWrapper">
    <!-- Paper Texture & Warm Ambient Lighting -->
    <div class="paper-texture"></div>
    <div class="sunlight-beam"></div>

    <!-- Top Status & Utility Bar -->
    <header class="relative z-40 flex items-center justify-between px-5 pt-4 pb-2 text-botanical-olive/80">
      <div class="flex items-center space-x-1.5">
        <svg class="w-4 h-4 text-botanical-gold animate-spin" style="animation-duration: 16s;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3" fill="#D4AF37" />
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3m-3.5-6.5l-2.1 2.1m-8.8 8.8l-2.1 2.1m0-13l2.1 2.1m8.8 8.8l2.1 2.1" />
        </svg>
        <span class="text-xs uppercase tracking-widest font-sans font-medium text-botanical-olive/90" id="headerTitle">Homenaje Poético</span>
      </div>
      <div class="flex items-center space-x-2">
        <!-- Sound Button -->
        <button id="btnSound" aria-label="Sonido ambiental" class="p-2 rounded-full bg-white/70 hover:bg-white text-botanical-olive shadow-sm transition backdrop-blur-md">
          <svg id="iconSoundOn" class="w-4 h-4 hidden text-botanical-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg id="iconSoundOff" class="w-4 h-4 text-botanical-olive/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <!-- Customize Button -->
        <button id="btnCustomize" aria-label="Personalizar dedicatoria" class="flex items-center space-x-1 px-2.5 py-1.5 rounded-full bg-white/70 hover:bg-white text-xs font-sans text-botanical-olive shadow-sm transition backdrop-blur-md">
          <svg class="w-3.5 h-3.5 text-botanical-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          <span class="font-medium">Personalizar</span>
        </button>
      </div>
    </header>

    <!-- Stage Area: SVG & Canvas Graphics -->
    <div class="relative flex-1 w-full h-full overflow-hidden" id="stageContainer">
      <!-- Master SVG World (0 0 540 960) -->
      <svg id="botanicalSvg" class="absolute inset-0 w-full h-full" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice">
        <defs>
          <!-- Gradients -->
          <!-- Soil Gradient -->
          <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7A563C" />
            <stop offset="25%" stop-color="#5A3E29" />
            <stop offset="65%" stop-color="#3F2B1D" />
            <stop offset="100%" stop-color="#24170F" />
          </linearGradient>

          <!-- Golden Seed Gradient -->
          <linearGradient id="seedGrad" x1="0.2" y1="0" x2="0.8" y2="1">
            <stop offset="0%" stop-color="#FCEFD2" />
            <stop offset="40%" stop-color="#E2B867" />
            <stop offset="85%" stop-color="#9C6B28" />
            <stop offset="100%" stop-color="#6E4413" />
          </linearGradient>

          <!-- Stem Gradient -->
          <linearGradient id="stemGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#4F6D46" />
            <stop offset="50%" stop-color="#718F64" />
            <stop offset="100%" stop-color="#9CB88E" />
          </linearGradient>

          <!-- Root Glow Filter -->
          <filter id="rootGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- Soft Petal Shadow Filter -->
          <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8C6E52" flood-opacity="0.18" />
          </filter>

          <!-- Golden Glow Filter -->
          <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="blur1" />
            <feGaussianBlur stdDeviation="2" result="blur2" />
            <feMerge>
              <feMergeNode in="blur1" />
              <feMergeNode in="blur2" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- Leaf Path Prototype -->
          <path id="leafShape" d="M 0 0 C 12 -18, 32 -26, 52 -18 C 65 -12, 75 -2, 85 0 C 75 2, 65 12, 52 18 C 32 26, 12 18, 0 0 Z" />
        </defs>

        <!-- Camera Group: Translates & Zooms during scenes -->
        <g id="cameraGroup" transform="translate(0, 0) scale(1)">
          
          <!-- Background Atmospheric Elements: Warm Rays & Soft Flora Silhouettes -->
          <g id="bgFloraSilhouettes" opacity="0.45">
            <path d="M40 640 Q65 520 50 420 Q35 340 70 280" stroke="#C8D4C0" stroke-width="2" fill="none" stroke-linecap="round" />
            <path d="M480 640 Q455 500 475 380 Q490 300 460 220" stroke="#C8D4C0" stroke-width="2" fill="none" stroke-linecap="round" />
            <circle cx="70" cy="280" r="4" fill="#DCE5D6" />
            <circle cx="460" cy="220" r="4" fill="#DCE5D6" />
          </g>

          <!-- Underground & Soil Layers -->
          <g id="soilLayer">
            <!-- Soil Mass -->
            <path id="soilPath" d="M -20 635 Q 135 620 270 632 T 560 626 L 560 1100 L -20 1100 Z" fill="url(#soilGrad)" />
            
            <!-- Surface Humus / Moss Texture Layer -->
            <path d="M -20 635 Q 135 620 270 632 T 560 626 L 560 655 Q 400 665 270 650 T -20 655 Z" fill="#694C35" opacity="0.75" />
            <path d="M -20 635 Q 135 620 270 632 T 560 626 L 560 642 Q 400 648 270 638 T -20 643 Z" fill="#6B7855" opacity="0.85" />
            
            <!-- Tiny surface sprout grass blades -->
            <g stroke="#8B9B74" stroke-width="1.8" stroke-linecap="round" fill="none">
              <path d="M 80 626 Q 85 615 92 612" />
              <path d="M 88 627 Q 95 618 97 610" />
              <path d="M 175 628 Q 170 616 162 613" />
              <path d="M 390 628 Q 396 617 404 614" />
              <path d="M 455 626 Q 450 615 444 612" />
            </g>

            <!-- Underground Mineral Strata Specks -->
            <g fill="#A68060" opacity="0.35">
              <circle cx="150" cy="720" r="2.5" />
              <circle cx="210" cy="790" r="1.8" />
              <circle cx="340" cy="740" r="2.2" />
              <circle cx="410" cy="830" r="3" />
              <circle cx="280" cy="870" r="2" />
              <circle cx="120" cy="850" r="2.5" />
            </g>
          </g>

          <!-- Underground Roots (Luminous / Bioluminescent) -->
          <g id="rootsGroup" filter="url(#rootGlow)">
            <!-- Central taproot -->
            <path id="rootMain" class="root-path" d="M 270 645 Q 268 710 273 770 Q 266 830 272 885" 
                  fill="none" stroke="#FCE4A6" stroke-width="3" stroke-linecap="round" />
            <!-- Primary Left Branch -->
            <path id="rootL1" class="root-path" d="M 270 660 Q 235 695 190 735 Q 150 780 120 840" 
                  fill="none" stroke="#FCE4A6" stroke-width="2.4" stroke-linecap="round" />
            <!-- Primary Right Branch -->
            <path id="rootR1" class="root-path" d="M 270 663 Q 308 690 350 730 Q 398 775 432 830" 
                  fill="none" stroke="#FCE4A6" stroke-width="2.4" stroke-linecap="round" />
            <!-- Sub-lateral branches -->
            <path id="rootL2" class="root-path" d="M 225 705 Q 195 750 165 810" 
                  fill="none" stroke="#F5D07E" stroke-width="1.8" stroke-linecap="round" />
            <path id="rootR2" class="root-path" d="M 315 700 Q 355 745 380 810" 
                  fill="none" stroke="#F5D07E" stroke-width="1.8" stroke-linecap="round" />
            <path id="rootL3" class="root-path" d="M 271 735 Q 240 790 220 855" 
                  fill="none" stroke="#F5D07E" stroke-width="1.6" stroke-linecap="round" />
            <path id="rootR3" class="root-path" d="M 271 745 Q 305 805 328 865" 
                  fill="none" stroke="#F5D07E" stroke-width="1.6" stroke-linecap="round" />
            <path id="rootSub1" class="root-path" d="M 190 735 Q 165 770 145 810" 
                  fill="none" stroke="#E6C470" stroke-width="1.2" stroke-linecap="round" />
            <path id="rootSub2" class="root-path" d="M 350 730 Q 380 770 398 810" 
                  fill="none" stroke="#E6C470" stroke-width="1.2" stroke-linecap="round" />
          </g>

          <!-- Root Glowing Energy Pulses / Orbs -->
          <g id="rootEnergyOrbs">
            <circle id="rootOrb1" cx="270" cy="645" r="3.5" fill="#FFFFFF" opacity="0" />
            <circle id="rootOrb2" cx="270" cy="645" r="3" fill="#FFF2B2" opacity="0" />
            <circle id="rootOrb3" cx="270" cy="645" r="2.8" fill="#FFF2B2" opacity="0" />
          </g>

          <!-- Golden Seed -->
          <g id="seedGroup" transform="translate(270, -40)">
            <g id="seedInner" transform="rotate(0)">
              <!-- Seed Drop Shadow -->
              <ellipse id="seedShadow" cx="0" cy="18" rx="12" ry="5" fill="#422E1F" opacity="0" />
              <!-- Seed Body -->
              <path d="M 0 -18 C 11 -8, 14 10, 0 20 C -14 10, -11 -8, 0 -18 Z" fill="url(#seedGrad)" filter="url(#goldGlow)" />
              <!-- Botanical cleft & gleam -->
              <path d="M 0 -14 C 4 -4, 4 8, 0 16" stroke="#5C3611" stroke-width="1.2" fill="none" opacity="0.6" />
              <path d="M -3 -12 C 1 -5, 2 6, -2 14" stroke="#FFF7E6" stroke-width="1" fill="none" opacity="0.75" />
            </g>
          </g>

          <!-- Botanical Stem (Organically Arching S-Curve) -->
          <g id="stemGroup">
            <path id="stemPath" d="M 270 635 C 264 540, 278 440, 268 335 C 262 265, 274 215, 270 170" 
                  fill="none" stroke="url(#stemGrad)" stroke-width="5" stroke-linecap="round" />
            <!-- Highlight contour line on stem -->
            <path id="stemGleam" d="M 270 635 C 264 540, 278 440, 268 335 C 262 265, 274 215, 270 170" 
                  fill="none" stroke="#D3E5CB" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
          </g>

          <!-- Botanical Leaves along the Stem -->
          <g id="leavesGroup">
            <!-- Leaf 1: Lower Left (at y=515) -->
            <g id="leaf1" transform="translate(266, 515) scale(0)">
              <g transform="rotate(-140)">
                <path d="M 0 0 C 14 -16, 36 -22, 60 -15 C 74 -10, 85 -2, 95 0 C 85 2, 74 10, 60 15 C 36 22, 14 16, 0 0 Z" 
                      fill="#8FA882" stroke="#5A754E" stroke-width="1.5" />
                <path d="M 0 0 Q 50 0 92 0" stroke="#C4DEC0" stroke-width="1.2" fill="none" />
                <!-- Secondary veins -->
                <path d="M 25 0 Q 38 -6 45 -12" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <path d="M 45 0 Q 58 -5 68 -10" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <path d="M 30 0 Q 42 6 50 12" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <path d="M 50 0 Q 62 5 72 10" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <!-- Dewdrop -->
                <circle cx="55" cy="-6" r="2.5" fill="#FFFFFF" opacity="0.8" />
              </g>
            </g>

            <!-- Leaf 2: Lower Right (at y=435) -->
            <g id="leaf2" transform="translate(273, 435) scale(0)">
              <g transform="rotate(-40)">
                <path d="M 0 0 C 14 -16, 36 -22, 60 -15 C 74 -10, 85 -2, 95 0 C 85 2, 74 10, 60 15 C 36 22, 14 16, 0 0 Z" 
                      fill="#86A37A" stroke="#536E48" stroke-width="1.5" />
                <path d="M 0 0 Q 50 0 92 0" stroke="#C4DEC0" stroke-width="1.2" fill="none" />
                <path d="M 25 0 Q 38 -6 45 -12" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <path d="M 45 0 Q 58 -5 68 -10" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <path d="M 30 0 Q 42 6 50 12" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <path d="M 50 0 Q 62 5 72 10" stroke="#B1D1AC" stroke-width="0.9" fill="none" />
                <circle cx="62" cy="5" r="2.2" fill="#FFFFFF" opacity="0.85" />
              </g>
            </g>

            <!-- Leaf 3: Upper Left (at y=345) -->
            <g id="leaf3" transform="translate(267, 345) scale(0)">
              <g transform="rotate(-150)">
                <path d="M 0 0 C 12 -14, 30 -19, 50 -13 C 62 -8, 72 -1, 80 0 C 72 1, 62 8, 50 13 C 30 19, 12 14, 0 0 Z" 
                      fill="#9BB691" stroke="#607D54" stroke-width="1.4" />
                <path d="M 0 0 Q 42 0 78 0" stroke="#CCE4C7" stroke-width="1.1" fill="none" />
                <path d="M 22 0 Q 33 -5 40 -10" stroke="#BBDABB" stroke-width="0.8" fill="none" />
                <path d="M 26 0 Q 37 5 44 10" stroke="#BBDABB" stroke-width="0.8" fill="none" />
                <circle cx="48" cy="-4" r="2" fill="#FFFFFF" opacity="0.8" />
              </g>
            </g>

            <!-- Leaf 4: Upper Right (at y=265) -->
            <g id="leaf4" transform="translate(271, 265) scale(0)">
              <g transform="rotate(-30)">
                <path d="M 0 0 C 12 -14, 30 -19, 50 -13 C 62 -8, 72 -1, 80 0 C 72 1, 62 8, 50 13 C 30 19, 12 14, 0 0 Z" 
                      fill="#A4BF9B" stroke="#68865C" stroke-width="1.4" />
                <path d="M 0 0 Q 42 0 78 0" stroke="#CCE4C7" stroke-width="1.1" fill="none" />
                <path d="M 22 0 Q 33 -5 40 -10" stroke="#BBDABB" stroke-width="0.8" fill="none" />
                <path d="M 26 0 Q 37 5 44 10" stroke="#BBDABB" stroke-width="0.8" fill="none" />
                <circle cx="50" cy="4" r="2" fill="#FFFFFF" opacity="0.8" />
              </g>
            </g>
          </g>

          <!-- Extraordinary Multicolored Flower -->
          <g id="flowerMasterGroup" transform="translate(270, 170)">
            
            <!-- Floral Calyx / Sepals (Green Base) -->
            <g id="calyxGroup" transform="scale(0)">
              <path d="M 0 10 C -12 25, -20 18, -25 5 C -15 0, -5 5, 0 10 Z" fill="#6E8C61" stroke="#4B6340" stroke-width="1.2" />
              <path d="M 0 10 C 12 25, 20 18, 25 5 C 15 0, 5 5, 0 10 Z" fill="#6E8C61" stroke="#4B6340" stroke-width="1.2" />
              <path d="M 0 10 C -5 28, 5 28, 0 35 C -2 28, 2 28, 0 10 Z" fill="#58734C" stroke="#4B6340" stroke-width="1.2" />
            </g>

            <!-- Petal Layer 1 (Outer: 8 Petals - Blush Rose Pastel) -->
            <g id="petalLayerOuter" transform="scale(0)"></g>

            <!-- Petal Layer 2 (Middle: 8 Petals - Soft Lavender & Mauve Pastel) -->
            <g id="petalLayerMid" transform="scale(0)"></g>

            <!-- Petal Layer 3 (Inner: 8 Petals - Warm Peach & Buttercup Yellow) -->
            <g id="petalLayerInner" transform="scale(0)"></g>

            <!-- Flower Radiant Golden Pistil / Stamen Core -->
            <g id="flowerCore" transform="scale(0)">
              <circle cx="0" cy="0" r="26" fill="#FCEAC3" />
              <circle cx="0" cy="0" r="18" fill="#F4CF74" />
              <!-- Radiating Stamens -->
              <g id="stamens"></g>
              <circle cx="0" cy="0" r="9" fill="#E8B542" />
              <circle cx="0" cy="0" r="5" fill="#FFE8A3" opacity="0.9" />
            </g>

            <!-- Four Ethereal Spark Orbs (Lead-in to Words) -->
            <g id="wordSparks">
              <circle id="sparkAmor" cx="0" cy="0" r="4" fill="#FFAEC0" filter="url(#goldGlow)" opacity="0" />
              <circle id="sparkPaciencia" cx="0" cy="0" r="4" fill="#D3C3FA" filter="url(#goldGlow)" opacity="0" />
              <circle id="sparkFuerza" cx="0" cy="0" r="4" fill="#FFCBA4" filter="url(#goldGlow)" opacity="0" />
              <circle id="sparkGratitud" cx="0" cy="0" r="4" fill="#FFEAA7" filter="url(#goldGlow)" opacity="0" />
            </g>

          </g>

        </g>
      </svg>

      <!-- HTML Overlay Layer for Four Released Words -->
      <div id="wordsContainer" class="absolute inset-0 pointer-events-none z-20">
        <!-- Palabra 1: Amor -->
        <div id="wordAmor" class="word-badge text-botanical-rose" style="top: 22%; left: 24%; opacity: 0; transform: translate(-50%, -50%) scale(0.6);">
          <span class="flex items-center space-x-1">
            <span class="text-sm">🌸</span>
            <span class="text-base text-[#B34D66] font-semibold" id="labelAmor">Amor</span>
          </span>
        </div>
        <!-- Palabra 2: Paciencia -->
        <div id="wordPaciencia" class="word-badge text-botanical-lavender" style="top: 22%; left: 76%; opacity: 0; transform: translate(-50%, -50%) scale(0.6);">
          <span class="flex items-center space-x-1">
            <span class="text-sm">🌿</span>
            <span class="text-base text-[#6B5794] font-semibold" id="labelPaciencia">Paciencia</span>
          </span>

    // Build Petal Geometries in SVG
    function buildFlowerPetals() {
      // Setup Stamens
      let stamenSvg = '';
      for (let i = 0; i < 24; i++) {
        const ang = (i / 24) * Math.PI * 2;
        const x1 = Math.cos(ang) * 9;
        const y1 = Math.sin(ang) * 9;
        const x2 = Math.cos(ang) * 22;
        const y2 = Math.sin(ang) * 22;
        stamenSvg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#DEB14B" stroke-width="1.2" />`;
        stamenSvg += `<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="2" fill="#FFE8A3" />`;
      }
      stamensContainer.innerHTML = stamenSvg;

      // Layer 1: Outer Petals (8 petals - Blush Rose Pastel)
      // Delicate pointed petal path with contour and gradient
      petalLayerOuter.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const deg = i * 45;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `rotate(${deg})`);
        g.innerHTML = `
          <path d="M 0 0 C -25 -40, -42 -85, 0 -130 C 42 -85, 25 -40, 0 0 Z" 
                fill="#F4B6BE" stroke="#DE9BA4" stroke-width="1.2" opacity="0.95" />
          <path d="M 0 0 C -12 -35, -20 -70, 0 -105 C 20 -70, 12 -35, 0 0 Z" 
                fill="#FAD4DA" opacity="0.75" />
          <path d="M 0 0 L 0 -115" stroke="#E58793" stroke-width="0.8" opacity="0.6" stroke-dasharray="3,2" />
        `;
        petalLayerOuter.appendChild(g);
      }

      // Layer 2: Mid Petals (8 petals - Soft Lavender & Mauve Pastel)
      petalLayerMid.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const deg = i * 45 + 22.5;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `rotate(${deg})`);
        g.innerHTML = `
          <path d="M 0 0 C -22 -32, -36 -68, 0 -105 C 36 -68, 22 -32, 0 0 Z" 
                fill="#C7BBE6" stroke="#AB9DD4" stroke-width="1.2" opacity="0.95" />
          <path d="M 0 0 C -10 -28, -18 -55, 0 -85 C 18 -55, 10 -28, 0 0 Z" 
                fill="#DFD6F3" opacity="0.8" />
          <path d="M 0 0 L 0 -92" stroke="#9986CE" stroke-width="0.8" opacity="0.6" stroke-dasharray="3,2" />
        `;
        petalLayerMid.appendChild(g);
      }

      // Layer 3: Inner Petals (8 petals - Warm Peach & Buttercup)
      petalLayerInner.innerHTML = '';
      for (let i = 0; i < 8; i++) {
        const deg = i * 45;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `rotate(${deg})`);
        g.innerHTML = `
          <path d="M 0 0 C -18 -22, -28 -50, 0 -76 C 28 -50, 18 -22, 0 0 Z" 
                fill="#FCD0A1" stroke="#E8B580" stroke-width="1.1" opacity="0.96" />
          <path d="M 0 0 C -8 -18, -14 -38, 0 -58 C 14 -38, 8 -18, 0 0 Z" 
                fill="#FFF0B3" opacity="0.85" />
        `;
        petalLayerInner.appendChild(g);
      }
    }
    buildFlowerPetals();

    // Setup Path Lengths for SVG Stroke Dashoffset Animations
    const rootLengths = [];
    rootPaths.forEach((rp, idx) => {
      const len = rp.getTotalLength();
      rootLengths[idx] = len;
      rp.style.strokeDasharray = len;
      rp.style.strokeDashoffset = len;
    });

    const stemLength = stemPath.getTotalLength();
    stemPath.style.strokeDasharray = stemLength;

    // Floating Petals & Ambient Dust Particles Engine
    const petalPalette = [
      { fill: '#F4B6BE', border: '#DE9BA4', type: 'rose' },
      { fill: '#FAD4DA', border: '#EAAFB6', type: 'lightRose' },
      { fill: '#C7BBE6', border: '#AB9DD4', type: 'lavender' },

    const particles = [];
    const NUM_PETALS = 38;
    const NUM_DUST = 24;

    function initParticles() {
      particles.length = 0;
      // Flower Petals
      for (let i = 0; i < NUM_PETALS; i++) {
        const col = petalPalette[Math.floor(Math.random() * petalPalette.length)];
        particles.push({
          type: 'petal',
          x: Math.random() * 540,
          y: Math.random() * 960,
          vx: (Math.random() - 0.5) * 0.8 + 0.3,
          vy: 0.6 + Math.random() * 1.0,
          scale: 0.5 + Math.random() * 0.7,
          rot: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 1.8,
          flip: Math.random() * Math.PI,
          vFlip: 0.02 + Math.random() * 0.03,
          color: col.fill,
          borderColor: col.border,
          sizeX: 14 + Math.random() * 8,
          sizeY: 20 + Math.random() * 10
        });
      }
      // Warm Sunlight Dust Motes
      for (let i = 0; i < NUM_DUST; i++) {
        particles.push({
          type: 'dust',
          x: Math.random() * 540,
          y: Math.random() * 960,
          vx: (Math.random() - 0.5) * 0.3,
          vy: -0.2 - Math.random() * 0.4,
          radius: 1.0 + Math.random() * 2.2,
          alpha: 0.2 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
    initParticles();

    function resizeCanvas() {
      const rect = stageContainer.getBoundingClientRect();
      petalsCanvas.width = rect.width * (window.devicePixelRatio || 1);
      petalsCanvas.height = rect.height * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawParticles(t) {
      const w = petalsCanvas.width;
      const h = petalsCanvas.height;
      ctx.clearRect(0, 0, w, h);

      // Intensity increases as flower blooms and reaches climax
      // t < 12: subtle dust
      // t >= 12 to 20: rising petals
      // t >= 20 to 25: full celebration swirl
      let petalOpacity = 0;
      if (t > 12.0) {
        petalOpacity = Math.min(1.0, (t - 12.0) / 4.0);
      }
      // After t=20, keep high opacity
      if (t >= 20.0) {
        petalOpacity = 1.0;
      }

      ctx.save();
      const scaleX = w / 540;
      const scaleY = h / 960;
      ctx.scale(scaleX, scaleY);

      // Dust motes
      const dustAlphaFactor = Math.min(1.0, t / 4.0);
      for (let p of particles) {
        if (p.type === 'dust') {
          p.x += p.vx + Math.sin(t + p.phase) * 0.3;
          p.y += p.vy;
          if (p.y < -10) p.y = 970;
          if (p.x < -10) p.x = 550;
          if (p.x > 550) p.x = -10;

          const shimmer = p.alpha * (0.6 + 0.4 * Math.sin(t * 3 + p.phase));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 240, 190, ${shimmer * dustAlphaFactor})`;
          ctx.fill();
        } else if (p.type === 'petal' && petalOpacity > 0.01) {
          // Petal kinematics with gentle wind sway
          p.x += p.vx + Math.sin(t * 1.5 + p.y * 0.01) * 0.8;
          p.y += p.vy;
          p.rot += p.vRot;
          p.flip += p.vFlip;

          if (p.y > 980) {
            p.y = -30;
            p.x = Math.random() * 540;
          }
          if (p.x < -30) p.x = 570;
          if (p.x > 570) p.x = -30;

          // Render petal in 3D perspective projection
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          const flipScale = Math.cos(p.flip);
          ctx.scale(p.scale, p.scale * flipScale);

          ctx.beginPath();
          ctx.moveTo(0, -p.sizeY);
          ctx.bezierCurveTo(p.sizeX, -p.sizeY * 0.5, p.sizeX * 0.8, p.sizeY * 0.5, 0, p.sizeY);
          ctx.bezierCurveTo(-p.sizeX * 0.8, p.sizeY * 0.5, -p.sizeX, -p.sizeY * 0.5, 0, -p.sizeY);
          
          ctx.fillStyle = p.color;
          ctx.globalAlpha = petalOpacity * 0.88;
          ctx.fill();

          ctx.lineWidth = 0.8;
          ctx.strokeStyle = p.borderColor;
          ctx.stroke();

          // Delicate central midrib line
          ctx.beginPath();
          ctx.moveTo(0, -p.sizeY * 0.7);
          ctx.lineTo(0, p.sizeY * 0.6);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.lineWidth = 0.6;
          ctx.stroke();

          ctx.restore();
        }
      }
      ctx.restore();
    }

    // Web Audio Chime & Harp Synthesis (Sample-Accurate Score Synchronization)
    const MUSICAL_SCORE = [
      { time: 0.5, freq: 392.00, dur: 2.2, type: 'sine', gain: 0.12 },     // G4 opening breath
      { time: 3.2, freq: 261.63, dur: 2.0, type: 'triangle', gain: 0.18 }, // C4 ground touch
      { time: 3.35, freq: 523.25, dur: 1.8, type: 'sine', gain: 0.12 },    // C5 ground sparkle
      { time: 4.5, freq: 329.63, dur: 1.8, type: 'sine', gain: 0.12 },     // E4 roots
      { time: 5.8, freq: 392.00, dur: 1.8, type: 'sine', gain: 0.12 },     // G4 roots
      { time: 7.0, freq: 440.00, dur: 2.0, type: 'sine', gain: 0.13 },     // A4 stem emerges
      { time: 7.8, freq: 523.25, dur: 2.0, type: 'triangle', gain: 0.15 }, // C5 «Amor» appears
      { time: 8.5, freq: 587.33, dur: 2.0, type: 'triangle', gain: 0.15 }, // D5 «Paciencia» appears
      { time: 9.2, freq: 659.25, dur: 2.2, type: 'triangle', gain: 0.15 }, // E5 «Fuerza» appears
      { time: 9.9, freq: 783.99, dur: 2.2, type: 'sine', gain: 0.16 },     // G5 «Gratitud» appears
      { time: 11.5, freq: 659.25, dur: 2.8, type: 'sine', gain: 0.15 },    // E5 flower blooming begins
      { time: 12.2, freq: 783.99, dur: 2.8, type: 'sine', gain: 0.14 },    // G5 flower blooming middle
      { time: 13.0, freq: 1046.50, dur: 3.2, type: 'sine', gain: 0.15 },   // C6 full bloom peak
      { time: 16.5, freq: 523.25, dur: 3.5, type: 'sine', gain: 0.16 },    // C5 dedication chord
      { time: 16.8, freq: 659.25, dur: 3.5, type: 'sine', gain: 0.14 },    // E5 dedication chord
      { time: 17.1, freq: 783.99, dur: 3.5, type: 'sine', gain: 0.14 },    // G5 dedication chord
      { time: 17.4, freq: 1046.50, dur: 4.0, type: 'sine', gain: 0.14 }    // C6 finale shimmer
    ];

    let notesPlayed = new Array(MUSICAL_SCORE.length).fill(false);
    let prevFrameTime = 0.0;

    function initAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
        }
      }
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }

    function playBotanicalChime(freq, duration = 1.8, type = 'sine', gainVal = 0.15) {
      if (!soundEnabled || !audioContext) return;
      try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(gainVal, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        // Safe sandbox audio fallback
      }
    }

    function syncAudioScore(curT, prevT) {
      if (!soundEnabled || !isPlaying || !audioContext) return;
      
      // If user jumped backwards, reset notes after curT
      if (curT < prevT) {
        for (let i = 0; i < MUSICAL_SCORE.length; i++) {
          if (MUSICAL_SCORE[i].time >= curT) {
            notesPlayed[i] = false;
          }
        }
        return;
      }

      // Play notes whose time window fell between prevT and curT
      for (let i = 0; i < MUSICAL_SCORE.length; i++) {
        const note = MUSICAL_SCORE[i];
        if (curT >= note.time && prevT < note.time && !notesPlayed[i]) {
          notesPlayed[i] = true;
          playBotanicalChime(note.freq, note.dur, note.type, note.gain);
        }
      }
    }

    function resetAudioTriggers() {
      notesPlayed = new Array(MUSICAL_SCORE.length).fill(false);
      prevFrameTime = 0.0;
    }

    // MAIN ANIMATION RENDER LOOP (Timeline 0s to 25s)
    function renderFrame(t) {
      // 1. Time Display & Progress
      const clampedTime = Math.min(t, TOTAL_DURATION);
      const minutes = Math.floor(clampedTime / 60);
      const seconds = Math.floor(clampedTime % 60);
      const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      timeCurrent.textContent = timeStr;
      timelineSlider.value = clampedTime;

      // -------------------------------------------------------------
      // PHASE 1: LA SEMILLA CAE SOBRE TIERRA ILUSTRADA (0.0s - 3.5s)
      // -------------------------------------------------------------
      if (t < 3.5) {
        // Camera stays at default neutral overview
        cameraGroup.setAttribute('transform', 'translate(0, 0) scale(1)');

        // Seed falling motion
        const seedProgress = Math.min(1.0, t / 3.2); // Lands at 3.2s
        // Ease in-out quadratic for natural air resistance and gravity
        const easeFall = seedProgress < 0.5 ? 2 * seedProgress * seedProgress : 1 - Math.pow(-2 * seedProgress + 2, 2) / 2;
        
        // Falling Y from -40 to 635 (soil top)
        const seedY = -40 + (635 - (-40)) * easeFall;
        // Natural swaying drift along X axis
        const swayX = Math.sin(t * 3.8) * 32 * (1 - seedProgress * 0.85);
        const rotDeg = Math.sin(t * 4.2) * 18 * (1 - seedProgress * 0.9);

        seedGroup.setAttribute('transform', `translate(${270 + swayX}, ${seedY})`);
        seedInner.setAttribute('transform', `rotate(${rotDeg})`);
        
        // Shadow grows as seed approaches earth
        if (seedProgress > 0.6) {
          const shadowOp = (seedProgress - 0.6) / 0.4;
          seedShadow.setAttribute('opacity', (shadowOp * 0.7).toFixed(2));
          seedShadow.setAttribute('rx', (8 * shadowOp).toFixed(1));
        } else {
          seedShadow.setAttribute('opacity', '0');
        }

        // Roots & Stem are hidden
        rootPaths.forEach(rp => rp.style.strokeDashoffset = rp.getTotalLength());
        stemPath.style.strokeDashoffset = stemLength;
        stemGleam.style.strokeDashoffset = stemLength;
        leaves.forEach(l => l.setAttribute('transform', l.getAttribute('transform').replace(/scale\([^)]+\)/, 'scale(0)')));
        calyxGroup.setAttribute('transform', 'scale(0)');
        petalLayerOuter.setAttribute('transform', 'scale(0)');
        petalLayerMid.setAttribute('transform', 'scale(0)');
        petalLayerInner.setAttribute('transform', 'scale(0)');
        flowerCore.setAttribute('transform', 'scale(0)');
        revelationContainer.classList.add('opacity-0');
        revelationContainer.style.opacity = '0';
      }

      // -------------------------------------------------------------
      // PHASE 2: CÁMARA SE ACERCA Y CRECEN RAÍCES LUMINOSAS (3.5s - 7.5s)
      // -------------------------------------------------------------
      else if (t >= 3.5 && t < 7.5) {
        // Seed is firmly planted at (270, 635)
        seedGroup.setAttribute('transform', 'translate(270, 635)');
        seedInner.setAttribute('transform', 'rotate(0)');
        seedShadow.setAttribute('opacity', '0.7');

        // Camera zooms in toward seed and pans slightly to reveal underground roots
        // Zoom progress from 3.5s to 5.5s
        const zoomProg = Math.min(1.0, (t - 3.5) / 2.0);
        const camScale = 1.0 + 0.32 * zoomProg; // Zoom to 1.32x
        const camY = -150 * zoomProg; // Pan down into earth
        const camX = (1 - camScale) * 270;
        cameraGroup.setAttribute('transform', `translate(${camX}, ${camY}) scale(${camScale})`);

        // Roots Growth Animation (3.8s to 7.2s)
        const rootProg = Math.max(0, Math.min(1.0, (t - 3.8) / 3.4));
        rootPaths.forEach((rp, idx) => {
          const len = rootLengths[idx];
          // Staggered branch growth
          const branchDelay = idx === 0 ? 0 : 0.15 + (idx * 0.08);
          const p = Math.max(0, Math.min(1.0, (rootProg - branchDelay) / (1 - branchDelay)));
          const currentOffset = len * (1 - p);
          rp.style.strokeDashoffset = currentOffset;
        });

        // Pulsing root light pulses
        const orbOp = Math.sin(t * 6) * 0.4 + 0.5;
        rootEnergyOrbs.style.opacity = (orbOp * rootProg).toFixed(2);

        // Stem has not emerged yet
        stemPath.style.strokeDashoffset = stemLength;
        stemGleam.style.strokeDashoffset = stemLength;
        leaves.forEach(l => l.setAttribute('transform', l.getAttribute('transform').replace(/scale\([^)]+\)/, 'scale(0)')));
        calyxGroup.setAttribute('transform', 'scale(0)');
        petalLayerOuter.setAttribute('transform', 'scale(0)');
        petalLayerMid.setAttribute('transform', 'scale(0)');
        petalLayerInner.setAttribute('transform', 'scale(0)');
        flowerCore.setAttribute('transform', 'scale(0)');
        revelationContainer.classList.add('opacity-0');
        revelationContainer.style.opacity = '0';
      }

      // -------------------------------------------------------------
      // PHASE 3: TALLO EMERGE Y APARECEN LAS PALABRAS ANTES DE QUE FLOREZCA (6.8s - 11.2s)
      // -------------------------------------------------------------
      else if (t >= 6.8 && t < 11.2) {
        rootPaths.forEach(rp => rp.style.strokeDashoffset = '0');

        // Camera smoothly glides back to 1.0 scale and centers on rising growth
        const camTransition = Math.min(1.0, (t - 6.8) / 2.0);
        const camScale = 1.32 - 0.32 * camTransition;
        const camY = -150 * (1 - camTransition);
        const camX = (1 - camScale) * 270;
        cameraGroup.setAttribute('transform', `translate(${camX}, ${camY}) scale(${camScale})`);

        // Stem Growth Progress (6.8s to 10.5s)
        const stemProg = Math.max(0, Math.min(1.0, (t - 6.8) / 3.7));
        const stemEase = 1 - Math.pow(1 - stemProg, 3);
        const curOffset = stemLength * (1 - stemEase);
        stemPath.style.strokeDashoffset = curOffset;
        stemGleam.style.strokeDashoffset = curOffset;

        // Leaves Unfurling in Sequence
        const l1Prog = Math.max(0, Math.min(1.0, (t - 7.5) / 1.0));
        leaves[0].setAttribute('transform', `translate(266, 515) scale(${l1Prog})`);

        const l2Prog = Math.max(0, Math.min(1.0, (t - 8.2) / 1.0));
        leaves[1].setAttribute('transform', `translate(273, 435) scale(${l2Prog})`);

        const l3Prog = Math.max(0, Math.min(1.0, (t - 8.9) / 1.0));
        leaves[2].setAttribute('transform', `translate(267, 345) scale(${l3Prog})`);

        const l4Prog = Math.max(0, Math.min(1.0, (t - 9.6) / 1.0));
        leaves[3].setAttribute('transform', `translate(271, 265) scale(${l4Prog})`);

        // Flower is still a delicate budding node
        const calyxProg = Math.max(0, Math.min(1.0, (t - 9.8) / 0.8));
        calyxGroup.setAttribute('transform', `scale(${calyxProg})`);
        petalLayerOuter.setAttribute('transform', 'scale(0)');
        petalLayerMid.setAttribute('transform', 'scale(0)');
        petalLayerInner.setAttribute('transform', 'scale(0)');
        flowerCore.setAttribute('transform', 'scale(0)');

        // PALABRAS APARECEN AQUÍ (ANTES DE QUE LA FLOR FLOREZCA):
        // 1. «Amor» (emerge a los 7.8s)
        if (t >= 7.8) {
          const pAmor = Math.min(1.0, (t - 7.8) / 0.9);
          wordElements.Amor.style.opacity = pAmor.toFixed(2);
          const floatAmorY = Math.sin(t * 2.5) * 6;
          wordElements.Amor.style.transform = `translate(-50%, calc(-50% + ${floatAmorY}px)) scale(${0.7 + 0.3 * pAmor})`;
        } else {
          wordElements.Amor.style.opacity = '0';
        }

        // 2. «Paciencia» (emerge a los 8.5s)
        if (t >= 8.5) {
          const pPaciencia = Math.min(1.0, (t - 8.5) / 0.9);
          wordElements.Paciencia.style.opacity = pPaciencia.toFixed(2);
          const floatPacY = Math.cos(t * 2.8) * 6;
          wordElements.Paciencia.style.transform = `translate(-50%, calc(-50% + ${floatPacY}px)) scale(${0.7 + 0.3 * pPaciencia})`;
        } else {
          wordElements.Paciencia.style.opacity = '0';
        }

        // 3. «Fuerza» (emerge a los 9.2s)
        if (t >= 9.2) {
          const pFuerza = Math.min(1.0, (t - 9.2) / 0.9);
          wordElements.Fuerza.style.opacity = pFuerza.toFixed(2);
          const floatFueY = Math.sin(t * 2.2 + 1) * 6;
          wordElements.Fuerza.style.transform = `translate(-50%, calc(-50% + ${floatFueY}px)) scale(${0.7 + 0.3 * pFuerza})`;
        } else {
          wordElements.Fuerza.style.opacity = '0';
        }

        // 4. «Gratitud» (emerge a los 9.9s)
        if (t >= 9.9) {
          const pGratitud = Math.min(1.0, (t - 9.9) / 0.9);
          wordElements.Gratitud.style.opacity = pGratitud.toFixed(2);
          const floatGraY = Math.cos(t * 2.4 + 1) * 6;
          wordElements.Gratitud.style.transform = `translate(-50%, calc(-50% + ${floatGraY}px)) scale(${0.7 + 0.3 * pGratitud})`;
        } else {
          wordElements.Gratitud.style.opacity = '0';
        }

        revelationContainer.classList.add('opacity-0');
        revelationContainer.style.opacity = '0';
      }

      // -------------------------------------------------------------
      // PHASE 4: LA FLOR EXTRAORDINARIA FLORECE NUTRIDA POR LAS PALABRAS (11.2s - 15.5s)
      // -------------------------------------------------------------
      else if (t >= 11.2 && t < 15.5) {
        cameraGroup.setAttribute('transform', 'translate(0, 0) scale(1)');
        rootPaths.forEach(rp => rp.style.strokeDashoffset = '0');
        stemPath.style.strokeDashoffset = '0';
        stemGleam.style.strokeDashoffset = '0';
        leaves.forEach(l => l.setAttribute('transform', l.getAttribute('transform').replace(/scale\([^)]+\)/, 'scale(1)')));
        calyxGroup.setAttribute('transform', 'scale(1)');

        // Blooming Progress of the Multi-colored Petal Layers (11.2s to 14.5s)
        // Outer Blush Rose
        const outerProg = Math.max(0, Math.min(1.0, (t - 11.2) / 2.2));
        const outerScale = Math.sin((outerProg * Math.PI) / 2);
        petalLayerOuter.setAttribute('transform', `scale(${outerScale})`);

        // Mid Soft Lavender
        const midProg = Math.max(0, Math.min(1.0, (t - 11.8) / 2.0));
        const midScale = Math.sin((midProg * Math.PI) / 2);
        petalLayerMid.setAttribute('transform', `scale(${midScale})`);

        // Inner Peach & Honey
        const innerProg = Math.max(0, Math.min(1.0, (t - 12.4) / 1.8));
        const innerScale = Math.sin((innerProg * Math.PI) / 2);
        petalLayerInner.setAttribute('transform', `scale(${innerScale})`);

        // Golden Stamen Center
        const coreProg = Math.max(0, Math.min(1.0, (t - 12.8) / 1.6));
        const coreScale = Math.sin((coreProg * Math.PI) / 2);
        flowerCore.setAttribute('transform', `scale(${coreScale})`);

        // Gentle breathing pulsation on full bloom
        if (t > 14.0) {
          const flowerBreath = 1.0 + Math.sin(t * 3.5) * 0.03;
          flowerMasterGroup.setAttribute('transform', `translate(270, 170) scale(${flowerBreath})`);
        } else {
          flowerMasterGroup.setAttribute('transform', 'translate(270, 170) scale(1)');
        }

        // Las 4 palabras flotan en su esplendor acompañando el florecimiento
        wordElements.Amor.style.opacity = '1';
        wordElements.Paciencia.style.opacity = '1';
        wordElements.Fuerza.style.opacity = '1';
        wordElements.Gratitud.style.opacity = '1';

        const floatAmorY = Math.sin(t * 2.5) * 6;
        wordElements.Amor.style.transform = `translate(-50%, calc(-50% + ${floatAmorY}px)) scale(1)`;

        const floatPacY = Math.cos(t * 2.8) * 6;
        wordElements.Paciencia.style.transform = `translate(-50%, calc(-50% + ${floatPacY}px)) scale(1)`;

        const floatFueY = Math.sin(t * 2.2 + 1) * 6;
        wordElements.Fuerza.style.transform = `translate(-50%, calc(-50% + ${floatFueY}px)) scale(1)`;

        const floatGraY = Math.cos(t * 2.4 + 1) * 6;
        wordElements.Gratitud.style.transform = `translate(-50%, calc(-50% + ${floatGraY}px)) scale(1)`;

        revelationContainer.classList.add('opacity-0');
        revelationContainer.style.opacity = '0';
      }

      // -------------------------------------------------------------
      // PHASE 5: REVELACIÓN DE «Gracias por darle tanto cariño y cuidado a mi jardín, Margot» + FOTO (15.5s - 25.0s)
      // -------------------------------------------------------------
      else if (t >= 15.5) {
        cameraGroup.setAttribute('transform', 'translate(0, 0) scale(1)');
        rootPaths.forEach(rp => rp.style.strokeDashoffset = '0');
        stemPath.style.strokeDashoffset = '0';
        stemGleam.style.strokeDashoffset = '0';
        leaves.forEach(l => l.setAttribute('transform', l.getAttribute('transform').replace(/scale\([^)]+\)/, 'scale(1)')));
        calyxGroup.setAttribute('transform', 'scale(1)');
        petalLayerOuter.setAttribute('transform', 'scale(1)');
        petalLayerMid.setAttribute('transform', 'scale(1)');
        petalLayerInner.setAttribute('transform', 'scale(1)');
        flowerCore.setAttribute('transform', 'scale(1)');

        // Words gently dissolve into radiant stardust as the grand tribute is revealed
        const fadeWords = Math.max(0, 1.0 - (t - 15.5) / 1.2);
        for (let k in wordElements) {
          wordElements[k].style.opacity = fadeWords.toFixed(2);
          if (fadeWords <= 0) wordElements[k].style.opacity = '0';
        }

        // Flower moves gracefully up to crown the scene like a regal garland
        const crownProg = Math.min(1.0, (t - 15.5) / 1.8);
        const crownY = 170 - 45 * crownProg; // Moves from 170 to 125
        const crownScale = 1.0 - 0.12 * crownProg;
        flowerMasterGroup.setAttribute('transform', `translate(270, ${crownY}) scale(${crownScale})`);

        // Stem smoothly fades to keep stage focused on the message & portrait
        stemGroup.style.opacity = (1.0 - 0.5 * crownProg).toFixed(2);

        // Climax Card & Photo Reveal (16.0s to 18.0s) - Butter-smooth cubic ease
        const revProg = Math.min(1.0, Math.max(0, (t - 16.0) / 1.8));
        const easeRev = 1 - Math.pow(1 - revProg, 3);
        revelationContainer.classList.remove('opacity-0');
        revelationContainer.style.opacity = easeRev.toFixed(3);
        const cardSlideY = (1 - easeRev) * 24;
        if (revelationCard) {
          revelationCard.style.transform = `translateY(${cardSlideY.toFixed(1)}px)`;
        }

        // Grand Climax Lingering Ambient
        // When t reaches 25s, animation completes smoothly
        if (t >= TOTAL_DURATION) {
          isPlaying = false;
          iconPlay.classList.remove('hidden');
          iconPause.classList.add('hidden');
          labelPlayPause.textContent = 'Reproducir';
        }
      }

      // 2. Render Petals Canvas & Synchronized Audio Score
      drawParticles(t);
      syncAudioScore(t, prevFrameTime);
      prevFrameTime = t;
    }

    // Animation Loop Runner
    function tick(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      // Clamp deltaTime to max 40ms to keep physics & audio completely smooth and prevent frame skips
      const rawDelta = (timestamp - lastTimestamp) / 1000;
      const deltaTime = Math.min(0.04, Math.max(0, rawDelta));
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += deltaTime;
        if (currentTime > TOTAL_DURATION) {
          currentTime = TOTAL_DURATION;
          isPlaying = false;
          iconPlay.classList.remove('hidden');
          iconPause.classList.add('hidden');
          labelPlayPause.textContent = 'Reproducir';
        }
      }

      renderFrame(currentTime);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Playback Controls
    function togglePlayPause() {
      initAudioContext();
      isPlaying = !isPlaying;
      if (isPlaying) {
        if (currentTime >= TOTAL_DURATION) {
          restartAnimation();
          return;
        }
        iconPlay.classList.add('hidden');
        iconPause.classList.remove('hidden');
        labelPlayPause.textContent = 'Pausar';
      } else {
        iconPlay.classList.remove('hidden');
        iconPause.classList.add('hidden');
        labelPlayPause.textContent = 'Reproducir';
      }
    }

    function restartAnimation() {
      initAudioContext();
      currentTime = 0.0;
      isPlaying = true;
      resetAudioTriggers();
      iconPlay.classList.add('hidden');
      iconPause.classList.remove('hidden');
      labelPlayPause.textContent = 'Pausar';
    }

    btnPlayPause.addEventListener('click', togglePlayPause);
    btnRestart.addEventListener('click', restartAnimation);
    btnQuickDedication.addEventListener('click', restartAnimation);

    // Timeline Scrubbing
    timelineSlider.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      renderFrame(currentTime);
    });

    timelineSlider.addEventListener('change', () => {
      if (currentTime >= TOTAL_DURATION) {
        isPlaying = false;
        iconPlay.classList.remove('hidden');
        iconPause.classList.add('hidden');
        labelPlayPause.textContent = 'Reproducir';
      }
    });

    // Sound Toggle
    btnSound.addEventListener('click', () => {
      initAudioContext();
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        iconSoundOn.classList.remove('hidden');
        iconSoundOff.classList.add('hidden');
        // Play welcome soft chord
        playBotanicalChime(523.25, 2.0, 'sine', 0.15);
      } else {
        iconSoundOn.classList.add('hidden');
        iconSoundOff.classList.remove('hidden');
      }
    });

    // Customization Modal Logic
    function openModal() {
      isPlaying = false;
      iconPlay.classList.remove('hidden');
      iconPause.classList.add('hidden');
      labelPlayPause.textContent = 'Reproducir';

      inputName.value = configData.name;
      inputDedication.value = configData.dedication;
      inputWord1.value = configData.words[0] || 'Amor';
      inputWord2.value = configData.words[1] || 'Paciencia';
      inputWord3.value = configData.words[2] || 'Fuerza';
      inputWord4.value = configData.words[3] || 'Gratitud';
      modalPreviewPhoto.src = activePhotoUrl;

      customizeModal.classList.remove('hidden');
    }

    function closeModal() {
      customizeModal.classList.add('hidden');
    }

    btnCustomize.addEventListener('click', openModal);
    btnCloseModal.addEventListener('click', closeModal);
    btnCancelModal.addEventListener('click', closeModal);

    // Photo Upload Handler in Modal
    inputPhotoFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          activePhotoUrl = evt.target.result;
          modalPreviewPhoto.src = activePhotoUrl;
        };
        reader.readAsDataURL(file);
      }
    });

    // Reset to Original Margot Photo
    btnResetPhoto.addEventListener('click', () => {
      activePhotoUrl = ORIGINAL_PHOTO_URL;
      modalPreviewPhoto.src = activePhotoUrl;
      inputPhotoFile.value = '';
    });

    // Save Customization
    customizeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newName = inputName.value.trim() || 'Margot';
      const newDedication = inputDedication.value.trim() || 'Gracias por darle tanto cariño y cuidado a mi jardín';
      const newWords = [
        inputWord1.value.trim() || 'Amor',
        inputWord2.value.trim() || 'Paciencia',
        inputWord3.value.trim() || 'Fuerza',
        inputWord4.value.trim() || 'Gratitud'
      ];

      configData.name = newName;
      configData.dedication = newDedication;
      configData.words = newWords;
      configData.photoUrl = activePhotoUrl;

      // Update UI elements
      recipientName.textContent = newName;
      dedicationText.textContent = `«${newDedication}»`;
      labelAmor.textContent = newWords[0];
      labelPaciencia.textContent = newWords[1];
      labelFuerza.textContent = newWords[2];
      labelGratitud.textContent = newWords[3];
      medallionPhoto.src = activePhotoUrl;
      btnQuickDedication.innerHTML = `<span>💐 ${newName}</span>`;

      // Save to localStorage if allowed
      try {
        localStorage.setItem('botanical_dedication_data', JSON.stringify(configData));
      } catch (err) {
        // Fallback for isolated iframes
      }

      closeModal();
      restartAnimation();
    });

    // Load saved preferences if available
    try {
      const saved = localStorage.getItem('botanical_dedication_data');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed.name) configData.name = parsed.name;
        if (parsed.dedication) configData.dedication = parsed.dedication;
        if (parsed.words && parsed.words.length === 4) configData.words = parsed.words;
        if (parsed.photoUrl) {
          configData.photoUrl = parsed.photoUrl;
          activePhotoUrl = parsed.photoUrl;
        }

        recipientName.textContent = configData.name;
        dedicationText.textContent = `«${configData.dedication}»`;
        labelAmor.textContent = configData.words[0];
        labelPaciencia.textContent = configData.words[1];
        labelFuerza.textContent = configData.words[2];
        labelGratitud.textContent = configData.words[3];
        medallionPhoto.src = activePhotoUrl;
        btnQuickDedication.innerHTML = `<span>💐 ${configData.name}</span>`;
      }
    } catch (err) {
      // Ignore in sandbox
    }

    // Auto-initialize audio on first user touch / click
    window.addEventListener('click', () => {
      initAudioContext();
    }, { once: true });
  </script>
</body>
</html>
