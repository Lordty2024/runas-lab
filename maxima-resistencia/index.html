<script>
'use strict';
/* =========================================================
   ¡MÁXIMA RESISTENCIA! — Las guardianas de la laguna
   Tower defense andino · un solo archivo · sin librerías
   ========================================================= */
const W=960,H=600,T=48,COLS=16,ROWS=10,BY=48,BW=COLS*T,BH=ROWS*T,PX=BW;
const LAKE={x:8*T,y:BY+5*T,rx:108,ry:100};
const cv=document.getElementById('c');
let X=cv.getContext('2d');
let K=1;
function resize(){const hint=document.getElementById('hint');const extra=(hint&&hint.offsetParent)?40:0;const s=Math.min(innerWidth/W,(innerHeight-extra)/H);const d=window.devicePixelRatio||1;cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);K=s*d;}
addEventListener('resize',resize);resize();

/* ---------- utilidades ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const tc=c=>c*T+T/2,tr=r=>BY+r*T+T/2;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function srand(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function fillRR(x,y,w,h,r,f,s,lw){rr(x,y,w,h,r);if(f){X.fillStyle=f;X.fill();}if(s){X.strokeStyle=s;X.lineWidth=lw||2;X.stroke();}else if(olOK(f,Math.min(w,h))){X.strokeStyle=OL;X.lineWidth=OLW;X.stroke();}}
function circ(x,y,r,f,s,lw){X.beginPath();X.arc(x,y,Math.max(0.1,r),0,Math.PI*2);if(f){X.fillStyle=f;X.fill();}if(s){X.strokeStyle=s;X.lineWidth=lw||2;X.stroke();}else if(olOK(f,r)){X.strokeStyle=OL;X.lineWidth=OLW;X.stroke();}}
function ell(x,y,a,b,f,s,lw){X.beginPath();X.ellipse(x,y,Math.max(0.1,a),Math.max(0.1,b),0,0,Math.PI*2);if(f){X.fillStyle=f;X.fill();}if(s){X.strokeStyle=s;X.lineWidth=lw||2;X.stroke();}else if(olOK(f,Math.min(a,b)*1.4)){X.strokeStyle=OL;X.lineWidth=OLW;X.stroke();}}
function line(x1,y1,x2,y2,c,w){X.strokeStyle=c;X.lineWidth=w||2;X.lineCap='round';X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();}
function star(x,y,r,c){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*0.45:r;X.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}X.closePath();X.fillStyle=c;X.fill();X.strokeStyle='rgba(0,0,0,.4)';X.lineWidth=0.8;X.stroke();}
const FONT="'Trebuchet MS','Segoe UI',Verdana,sans-serif";
function txt(s,x,y,sz,col,al,stroke){X.font='bold '+sz+'px '+FONT;X.textAlign=al||'left';X.textBaseline='middle';if(stroke){X.lineWidth=Math.max(2.5,sz/4.5);X.strokeStyle=stroke;X.lineJoin='round';X.strokeText(s,x,y);}X.fillStyle=col||'#fff';X.fillText(s,x,y);}
function wrapLines(s,maxW,sz){X.font='bold '+sz+'px '+FONT;const words=s.split(' ');let ln='';const out=[];for(const w of words){const t=ln?ln+' '+w:w;if(X.measureText(t).width>maxW&&ln){out.push(ln);ln=w;}else ln=t;}if(ln)out.push(ln);return out;}
function wrapTxt(s,x,y,maxW,sz,col,al,lh,stroke){const L=wrapLines(s,maxW,sz);lh=lh||sz*1.3;L.forEach((l,i)=>txt(l,x,y+i*lh,sz,col,al,stroke));return L.length*lh;}
function hex(c){if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function mix(a,b,t){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
/* ---------- estilo caricatura: tipografía, contornos y escenografía ---------- */
const TFONT="'Lilita One','Arial Black','Trebuchet MS',sans-serif";
try{if(document.fonts)document.fonts.load('40px "Lilita One"');}catch(e){}
let OL=null,OLW=1.3;
function olOK(f,sz){return!!OL&&typeof f==='string'&&f[0]==='#'&&sz>=2.4;}
const GOLD=['#FFE979','#F6A21E'],CREAM=['#FFFFFF','#F1DDBB'],REDG=['#FF7A7A','#D62828'],GREENG=['#B4F58A','#2B9348'];
function ttl(s,x,y,sz,fill,al,o){o=o||{};X.font=sz+'px '+TFONT;X.textAlign=al||'center';X.textBaseline='middle';X.lineJoin='round';X.miterLimit=2;
  X.lineWidth=sz/3.6;X.strokeStyle='rgba(25,8,45,.5)';X.strokeText(s,x,y+sz*0.1);
  X.lineWidth=sz/4.2;X.strokeStyle=o.stroke||'#2E1450';X.strokeText(s,x,y);
  let f=fill;if(Array.isArray(fill)){const g=X.createLinearGradient(0,y-sz*0.45,0,y+sz*0.45);g.addColorStop(0,fill[0]);g.addColorStop(1,fill[1]);f=g;}
  X.fillStyle=f;X.fillText(s,x,y);}
function drawED(type,t,e){const p=OL,pw=OLW;OL='#22142E';OLW=1.2;try{(ED[type])(t,e);}finally{OL=p;OLW=pw;}}
function sparkle(x,y,r,c){X.beginPath();X.moveTo(x,y-r);X.quadraticCurveTo(x,y,x+r,y);X.quadraticCurveTo(x,y,x,y+r);X.quadraticCurveTo(x,y,x-r,y);X.quadraticCurveTo(x,y,x,y-r);X.fillStyle=c;X.fill();}
function cattails(x,y,t,s){s=s||1;line(x-3*s,y,x-10*s,y-13*s,'#5DA032',1.8*s);line(x+3*s,y,x+11*s,y-15*s,'#4F9A2C',1.8*s);
  for(let j=0;j<3;j++){const ox=(j-1)*4*s,h=(15+((j*7)%9))*s,sw=Math.sin(t*1.6+x*0.07+j)*1.4*s;line(x+ox,y,x+ox+sw,y-h,'#4F8A2B',1.6*s);ell(x+ox+sw,y-h-4*s,2.2*s,5.2*s,'#7B4A21','#3E2410',1);line(x+ox+sw,y-h-9*s,x+ox+sw,y-h-12*s,'#4F8A2B',1);}}
function tuft(x,y,kind,R){const cols=kind==='straw'?['#B8913C','#E8C76E','#D9B65C']:['#3F8A25','#7CC943','#5CB236'];for(let i=-3;i<=3;i++){const h=6+R()*6-Math.abs(i);line(x+i*1.2,y,x+i*2.4,y-h,cols[(i+3)%3],1.5);}}
function bush(x,y,s){const P=[[-9,-4,8],[9,-4,8],[0,-10,10],[0,-2,9]];ell(x,y+4*s,16*s,4.5*s,'rgba(20,60,10,.22)');P.forEach(c=>circ(x+c[0]*s,y+c[1]*s,c[2]*s,'#3F9A34','#1F4F1A',2));P.forEach(c=>circ(x+c[0]*s,y+c[1]*s,c[2]*s-1.6,'#3F9A34'));circ(x-3*s,y-13*s,4*s,'#66C24F');circ(x-10*s,y-7*s,2.5*s,'#66C24F');}
function boulder(x,y,s){ell(x,y+s*0.55,s*1.35,s*0.45,'rgba(0,0,0,.2)');X.beginPath();X.moveTo(x-s*1.2,y+s*0.4);X.quadraticCurveTo(x-s*1.3,y-s*0.6,x-s*0.4,y-s*0.9);X.quadraticCurveTo(x+s*0.6,y-s*1.2,x+s*1.15,y-s*0.2);X.quadraticCurveTo(x+s*1.3,y+s*0.5,x,y+s*0.55);X.closePath();X.fillStyle='#A3A1AE';X.fill();X.strokeStyle='#5E5C6A';X.lineWidth=1.5;X.stroke();ell(x-s*0.35,y-s*0.5,s*0.45,s*0.2,'#C9C7D2');}
function cloud(x,y,s){X.save();X.translate(x,y);X.scale(s,s);const P=[[-40,4,20],[-16,-10,27],[14,-14,30],[40,0,22],[0,6,26]];P.forEach(c=>circ(c[0],c[1]+5,c[2],'#C3E5FA'));P.forEach(c=>circ(c[0],c[1],c[2],'#FFFFFF'));X.restore();}
function tree(x,y,s){X.save();X.translate(x,y);X.scale(s,s);ell(0,2,24,6,'rgba(20,60,10,.25)');fillRR(-5,-24,10,26,3,'#7A4A26','#3E2410',2);
  const P=[[-15,-32,16],[15,-32,16],[0,-48,19],[0,-30,18]];P.forEach(c=>circ(c[0],c[1],c[2],'#3F9A34','#1F4F1A',2.5));P.forEach(c=>circ(c[0],c[1],c[2]-2.2,'#3F9A34'));circ(-6,-54,7,'#62BE4E');circ(-19,-36,5,'#62BE4E');circ(10,-40,4,'#62BE4E');X.restore();}
function ruins(x,y,s){X.save();X.translate(x,y);X.scale(s,s);ell(0,2,82,8,'rgba(30,60,20,.25)');
  for(let ri=0;ri<4;ri++){const xl=-66+ri*7,xr=66-ri*7;let bx=xl,k=ri;while(bx<xr-4){const bw=Math.min(xr-bx,k%2?22:28);fillRR(bx+1,-16*(ri+1),bw-2,15,3,(k%3===0)?'#ADA89E':'#BDB8AE','#5F5A52',1.6);bx+=bw;k++;}}
  X.beginPath();X.moveTo(-13,0);X.lineTo(13,0);X.lineTo(9,-44);X.lineTo(-9,-44);X.closePath();X.fillStyle='#3B3646';X.fill();X.strokeStyle='#5F5A52';X.lineWidth=1.6;X.stroke();
  fillRR(-18,-54,36,11,2,'#C8C3B9','#5F5A52',1.6);fillRR(-88,-15,18,15,3,'#B3AEA4','#5F5A52',1.6);fillRR(72,-12,16,12,3,'#B3AEA4','#5F5A52',1.6);
  for(let i=-3;i<=3;i++)line(-70+i*3,0,-70+i*5,-8-Math.abs(i),'#5CB236',1.5);X.restore();}
function mountain(px,py,hw,base,col,snow){X.beginPath();X.moveTo(px-hw,base);X.lineTo(px,py);X.lineTo(px+hw,base);X.closePath();X.fillStyle=col;X.fill();
  X.beginPath();X.moveTo(px,py);X.lineTo(px+hw,base);X.lineTo(px+hw*0.1,base);X.closePath();X.fillStyle='rgba(30,10,60,.16)';X.fill();
  if(snow){const sh=(base-py)*0.28,sw=hw*0.28;X.beginPath();X.moveTo(px,py);X.lineTo(px+sw,py+sh);X.lineTo(px+sw*0.4,py+sh*0.78);X.lineTo(px,py+sh*1.05);X.lineTo(px-sw*0.45,py+sh*0.75);X.lineTo(px-sw,py+sh);X.closePath();X.fillStyle='#FFFFFF';X.fill();}}
function woodBanner(cx,cy,w,h,s){const tx=w/2;
  [-1,1].forEach(sg=>{X.beginPath();X.moveTo(cx+sg*(tx-20),cy-h/2+6);X.lineTo(cx+sg*(tx+24),cy-h/2+8);X.lineTo(cx+sg*(tx+12),cy+2);X.lineTo(cx+sg*(tx+24),cy+h/2+6);X.lineTo(cx+sg*(tx-20),cy+h/2+4);X.closePath();X.fillStyle='#7A3E17';X.fill();X.strokeStyle='#2E1450';X.lineWidth=2.5;X.lineJoin='round';X.stroke();});
  const g=X.createLinearGradient(0,cy-h/2,0,cy+h/2);g.addColorStop(0,'#C97A3A');g.addColorStop(1,'#8A4A1E');rr(cx-w/2,cy-h/2,w,h,8);X.fillStyle=g;X.fill();X.strokeStyle='#2E1450';X.lineWidth=3;X.stroke();
  line(cx-w/2+12,cy-h/2+6,cx+w/2-12,cy-h/2+6,'rgba(255,220,170,.4)',1.5);line(cx-w/2+30,cy+h/2-6,cx+w/2-50,cy+h/2-6,'rgba(70,30,10,.35)',1.2);
  [-1,1].forEach(sg=>{const dx=cx+sg*(w/2-18);X.beginPath();X.moveTo(dx,cy-9);X.lineTo(dx+9,cy);X.lineTo(dx,cy+9);X.lineTo(dx-9,cy);X.closePath();X.fillStyle='#FFD23F';X.fill();X.strokeStyle='#5A2A0A';X.lineWidth=2;X.stroke();circ(dx,cy,2.5,'#7A3E17');});
  ttl(s,cx,cy+1,21,['#FFF8E7','#FFE2A6'],'center',{stroke:'#4A2108'});}
function menuTitle(){const cx=W/2;X.font='58px '+TFONT;const w1=X.measureText('¡MÁXIMA').width;
  [-1,1].forEach(sg=>{const ax=cx+sg*(w1/2+12),ay=52;for(let i=0;i<3;i++){const a=(sg<0?Math.PI:0)+sg*(-0.55+i*0.45)*-1;const a2=sg<0?Math.PI+(-0.5+i*0.45):-(-0.5+i*0.45);line(ax+Math.cos(a2)*10,ay+Math.sin(a2)*10-8,ax+Math.cos(a2)*28,ay+Math.sin(a2)*28-8,i===1?'#FFD23F':'#FF5A5F',6);void a;}});
  ttl('¡MÁXIMA',cx,62,58,GOLD);
  X.font='64px '+TFONT;const w=X.measureText('RESISTENCIA').width,we=X.measureText('!').width,x0=cx-(w+we)/2;
  ttl('RESISTENCIA',x0,122,64,CREAM,'left');ttl('!',x0+w+2,122,64,REDG,'left');
  woodBanner(cx,176,360,34,'Las guardianas de la laguna');}
function drawLakeAt(cx,cy,rx,ry,t,q,cs){
  const k=1-q;
  ell(cx,cy+8,rx+18,ry+15,'rgba(30,70,20,.22)');ell(cx,cy+3,rx+12,ry+11,'#A99670');
  const n=Math.round((rx+ry)*0.17);
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2+0.1,sx=cx+Math.cos(a)*(rx+6),sy=cy+Math.sin(a)*(ry+6)+2;X.save();X.translate(sx,sy);X.rotate(Math.atan2(ry*Math.cos(a),-rx*Math.sin(a)));fillRR(-8,-5.5,16,11,4.5,i%3===0?'#D4C49C':'#E6D9B5','#7E6C4A',1.4);line(-5,-3,3,-3,'rgba(255,255,255,.5)',1.4);X.restore();}
  const g=X.createRadialGradient(cx-rx*0.15,cy-ry*0.2,4,cx,cy,Math.max(rx,ry));
  g.addColorStop(0,mix('#8EE6FA','#B5A66A',k));g.addColorStop(0.45,mix('#2FA6DF','#8A7A44',k));g.addColorStop(1,mix('#1559A8','#4A3B20',k));
  X.fillStyle=g;X.beginPath();X.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);X.fill();
  X.save();X.beginPath();X.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);X.clip();
  X.strokeStyle='rgba(10,40,90,.35)';X.lineWidth=9;X.beginPath();X.ellipse(cx,cy+4,rx,ry,0,0,Math.PI*2);X.stroke();
  X.globalAlpha=0.75;for(let i=0;i<5;i++){const a=i*1.37+0.5,px=cx+Math.cos(a)*rx*0.62,py=cy+Math.sin(a)*ry*0.6;X.beginPath();X.ellipse(px,py,rx*0.07+3,ry*0.05+2.5,0,0.35,Math.PI*2-0.1);X.lineTo(px,py);X.closePath();X.fillStyle=mix('#2E8A63','#5A5A2A',k);X.fill();}X.globalAlpha=1;
  for(let i=0;i<6;i++){const y=cy-ry*0.75+i*ry*0.3,off=Math.sin(t*1.2+i)*16;X.strokeStyle='rgba(255,255,255,.25)';X.lineWidth=2;X.beginPath();for(let x=-rx;x<=rx;x+=6){const yy=y+Math.sin((x+off+t*30)/14)*2.2;x===-rx?X.moveTo(cx+x,yy):X.lineTo(cx+x,yy);}X.stroke();}
  for(let i=0;i<6;i++){const a=t*0.35+i*1.1,sp=(Math.sin(t*2.2+i*2)+1)/2;sparkle(cx+Math.cos(a)*rx*0.6,cy+Math.sin(a*1.3)*ry*0.5,2+sp*3.5,'rgba(255,255,255,'+(0.35+sp*0.6).toFixed(2)+')');}
  if(k>0.3){for(let i=0;i<Math.floor(k*8);i++)ell(cx+Math.cos(i*2.3)*rx*0.5,cy+Math.sin(i*1.7)*ry*0.5,12,6,'rgba(70,55,25,.35)');}
  X.restore();
  [0.15,0.7,1.9,2.5,3.3,3.9,4.9,5.6].forEach(a=>cattails(cx+Math.cos(a)*(rx+12),cy+Math.sin(a)*(ry+12)+6,t,cs||1));
}

/* ---------- guardado ---------- */
const SAVE_KEY='maximaResistencia_v1';
let save={unlocked:1,best:{},done:false,music:true,sfx:true};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s&&typeof s==='object')save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* =========================================================
   AUDIO (Web Audio API): efectos + música distinta por nivel
   ========================================================= */
let AC=null,master,musG,sfxG,noiseBuf,musicTimer=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=new Ctx();master=AC.createGain();master.gain.value=0.85;master.connect(AC.destination);
    musG=AC.createGain();musG.gain.value=save.music?0.2:0;musG.connect(master);
    sfxG=AC.createGain();sfxG.gain.value=save.sfx?0.42:0;sfxG.connect(master);
    noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    mNext=AC.currentTime+0.1;musicTimer=setInterval(musicTick,25);
  }catch(e){AC=null;}
}
function tone(f,t0,dur,type,vol,dest,o){
  try{o=o||{};const os=AC.createOscillator(),g=AC.createGain();os.type=type||'sine';os.frequency.setValueAtTime(f,t0);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);
  const a=o.attack||0.006;g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  let node=os;if(o.filt){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.filt;os.connect(fl);node=fl;}
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.2;lg.gain.value=f*0.012;l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+dur+0.05);}
  node.connect(g);g.connect(dest);os.start(t0);os.stop(t0+dur+0.05);}catch(e){}
}
function noise(t0,dur,vol,dest,freq,type){
  try{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||1000;const g=AC.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t0);s.stop(t0+dur+0.02);}catch(e){}
}
const sfxLast={};
function sfx(n){
  if(!AC||!save.sfx)return;const now=AC.currentTime;if(sfxLast[n]&&now-sfxLast[n]<0.06)return;sfxLast[n]=now;const d=sfxG;
  switch(n){
    case'sling':noise(now,0.08,0.25,d,2500);tone(620,now,0.08,'triangle',0.12,d,{slide:300});break;
    case'hit':tone(230,now,0.07,'square',0.06,d,{slide:110,filt:1200});break;

/* ---------- defensoras ---------- */
function defStats(d){const b=DEF[d.type],L=d.lvl;const dm=[1,1.55,2.25][L-1],rg=[0,0.35,0.7][L-1],rt=[1,0.88,0.76][L-1],hp=[1,1.3,1.65][L-1];
  return{dmg:(b.dmg||0)*dm,range:(b.range+rg)*T,rate:b.rate*rt,maxhp:b.hp*hp,heal:(b.heal||0)*dm,aoe:(b.aoe||0)*[1,1.1,1.25][L-1]*T};}
const upCost=d=>Math.round(DEF[d.type].cost*(d.lvl===1?0.85:1.3));
const sellVal=d=>Math.round(d.spent*0.6);
function placeDef(type,c,r){const b=DEF[type];G.coins-=b.cost;
  const d={type,c,r,x:tc(c),y:tr(r)+2,lvl:1,hp:b.hp,maxhp:b.hp,cd:0.4,bt:4,spent:b.cost,anim:0,ko:0,disabled:0,bless:0,dir:1};
  G.defs.push(d);addText(d.x,d.y-40,b.quote,'#fff',{bubble:true,dur:2.6,size:11});sfx('place');burst(d.x,d.y+8,10,b.color);
  G.sel=d;if(G.coins<b.cost)G.placeType=null;}
function upgradeDef(d){if(d.lvl>=3)return;const c=upCost(d);if(G.coins<c){sfx('bad');return;}G.coins-=c;d.spent+=c;d.lvl++;const s=defStats(d);d.hp=s.maxhp;d.maxhp=s.maxhp;sfx('up');burst(d.x,d.y,16,'#FFD23F');addText(d.x,d.y-38,'¡Nivel '+d.lvl+'!','#FFD23F');}
function sellDef(d){G.coins+=sellVal(d);G.defs.splice(G.defs.indexOf(d),1);if(G.sel===d)G.sel=null;sfx('sell');addText(d.x,d.y-20,'+'+sellVal(d),'#FFD23F');}
function hurtDef(d,a){if(d.ko>0)return;d.hp-=a;d.hurtT=0.15;if(d.hp<=0){d.hp=0;d.ko=8;d.disabled=0;sfx('ko');addText(d.x,d.y-34,'¡Uf! Un descansito','#fff');}}
function disableDef(d,s){if(d.ko>0)return;d.disabled=Math.max(d.disabled,s);G.fx.push({type:'ring',x:d.x,y:d.y-8,t:0,dur:0.4,r0:6,r1:22,col:'193,18,31'});}
function scared(d){return G.obst.some(o=>o.kind==='pishtaco'&&dist(o.x,o.y,d.x,d.y)<1.7*T);}
function defsNear(x,y,R){return G.defs.filter(d=>d.ko<=0&&dist(x,y,d.x,d.y)<=R).sort((a,b)=>dist(x,y,a.x,a.y)-dist(x,y,b.x,b.y));}
function enemiesInRange(x,y,R){return G.enemies.filter(e=>!e.dead&&!(e.hidden>0)&&dist(x,y,e.x,e.y)<=R+e.size*0.5);}
function updDef(d,h){
  const s=defStats(d);d.maxhp=s.maxhp;if(d.hurtT>0)d.hurtT-=h;
  if(d.ko>0){d.ko-=h;if(d.ko<=0){d.ko=0;d.hp=d.maxhp*0.5;addText(d.x,d.y-34,'¡De pie otra vez!','#B7F7C1');}return;}

  switch(d.type){
    case'pastora':{const n=d.lvl===3?2:1;for(let i=0;i<Math.min(n,tg.length);i++)G.projs.push({kind:'stone',x:d.x+8,y:d.y-24,target:tg[i],tx:tg[i].x,ty:tg[i].y,spd:520,dmg,home:true});sfx('sling');break;}
    case'agricultora':{const hits=d.lvl===3?tg:[tg[0]];hits.forEach(e=>{hurt(e,dmg);G.fx.push({type:'slash',x:e.x,y:e.y-12,t:0,dur:0.25});});sfx('chop');break;}

    case'cocinera':{const e=tg[0];const lead=Math.min(e.path.len,e.d+e.spd*T*0.5);const p=posAt(e.path,lead);G.projs.push({kind:'pot',arc:true,sx:d.x+6,sy:d.y-20,x:d.x,y:d.y,tx:p.x,ty:p.y,t:0,dur:0.6,h:46,dmg,aoe:s.aoe,burn:d.lvl===3});sfx('yarn');break;}
  }
}
function chamanaAct(d,s,h){
  d.bt-=h*(G.buffAtk>0?1.35:1);

    const allies=G.defs.filter(o=>dist(o.x,o.y,d.x,d.y)<=s.range);
    const ko=allies.find(o=>o.ko>0);
    const hurtA=allies.filter(o=>o.ko<=0&&o.hp<o.maxhp-1).sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp);
    if(ko){ko.ko=Math.max(0.01,ko.ko-2.5);d.cd=s.rate;d.anim=1;G.fx.push({type:'beam',x:d.x,y:d.y-18,x2:ko.x,y2:ko.y-10,t:0,dur:0.35});sfx('heal');}
    else if(hurtA.length){const o=hurtA[0];o.hp=Math.min(o.maxhp,o.hp+s.heal);d.cd=s.rate;d.anim=1;G.fx.push({type:'beam',x:d.x,y:d.y-18,x2:o.x,y2:o.y-10,t:0,dur:0.35});addText(o.x,o.y-30,'+'+Math.round(s.heal),'#7CFC9A',{size:11});sfx('heal');}
  }
  if(d.bt<=0){
    const cand=G.defs.filter(o=>o!==d&&o.type!=='chamana'&&o.ko<=0&&dist(o.x,o.y,d.x,d.y)<=s.range);
    if(cand.length){cand.sort((a,b)=>(b.disabled>0)-(a.disabled>0)||(a.bless>0)-(b.bless>0)||b.lvl-a.lvl);const o=cand[0];o.bless=6;o.disabled=0;d.bt=[10,9,7][d.lvl-1];d.anim=1;addText(o.x,o.y-36,'¡Bendecida!','#FFE08A');G.fx.push({type:'ring',x:o.x,y:o.y-8,t:0,dur:0.6,r0:4,r1:28,col:'255,215,80'});sfx('heal');}
    else d.bt=1;

}

function hurt(e,dmg){
  if(e.dead||e.hidden>0)return;

  if(dmg<=0)return;e.hp-=dmg;e.flash=0.08;if(e.hp<=0)kill(e);
}
function kill(e){
  if(e.dead)return;e.dead=true;G.coins+=e.reward;G.kills++;G.score+=e.reward;
  addText(e.x,e.y-20,'+'+e.reward,'#FFD84A',{size:e.boss?18:12});burst(e.x,e.y-8,e.boss?40:8,e.boss?'#FFD23F':'#ffffff');sfx('coin');
  if(e.boss){G.boss=null;bossMusic=G.enemies.some(o=>o.boss&&!o.dead);G.shake=0.7;sfx('win');G.announce={text:'¡'+EN[e.type].name+' derrotado!',sub:'La comunidad celebra con chicha morada',t:0,dur:2.6};for(let i=0;i<4;i++)burst(e.x+rnd(-30,30),e.y-rnd(0,40),14,pick(['#FFD23F','#D6336C','#2BB6C9','#7CFC9A']));}

function enemyShot(e,d,dmg){G.projs.push({kind:'paper',x:e.x,y:e.y-20,tdef:d,tx:d.x,ty:d.y-10,spd:250,dmg});}
function pollute(x,y,R){
  const cand=[];for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){if(G.grid[c][r]!==0)continue;if(G.defs.some(d=>d.c===c&&d.r===r)||G.obst.some(o=>o.c===c&&o.r===r))continue;if(R&&dist(tc(c),tr(r),x,y)>R)continue;cand.push([c,r]);}
  if(!cand.length)return false;const [c,r]=pick(cand);G.obst.push({kind:'mancha',c,r,x:tc(c),y:tr(r),taps:0,need:3,life:22,t:0});return true;

function updEnemy(e,h){
  if(e.flash>0)e.flash-=h;

  if(e.stun>0){e.stun-=h;return;}
  let sp=e.spd*e.spdMul;
  if(e.slowT>0){e.slowT-=h;sp*=e.slowF;}else e.slowF=1;
  if(e.apuSlow>0){e.apuSlow-=h;sp*=0.5;}
  if(e.auraT>0){e.auraT-=h;sp*=1.35;}
  e.d+=sp*T*h;const pp=posAt(e.path,e.d);e.x=pp.x;e.y=pp.y;if(pp.dx)e.dir=pp.dx>0?1:-1;
  if(e.d>=e.path.len){reachLake(e);return;}

    case'leguleyo':if(e.abT<=0){const ds=defsNear(e.x,e.y,2.4*T);if(ds.length){enemyShot(e,ds[0],10);sfx('paper');e.abT=2.2;}else e.abT=0.4;}break;
    case'influencer':G.enemies.forEach(o=>{if(o!==e&&!o.dead&&dist(o.x,o.y,e.x,e.y)<1.6*T)o.auraT=0.2;});if(e.abT<=0){e.abT=3;G.fx.push({type:'heart',x:e.x+8,y:e.y-34,t:0,dur:1});}break;
    case'servidor':if(e.abT<=0){e.abT=4;const ds=defsNear(e.x,e.y,1.7*T);ds.forEach(d=>hurtDef(d,14));G.fx.push({type:'ring',x:e.x,y:e.y-10,t:0,dur:0.6,r0:8,r1:1.7*T,col:'255,140,40'});}
      if(!e.hot&&e.hp<e.maxhp*0.3){e.hot=true;e.spdMul=1.7;addText(e.x,e.y-44,'¡SOBRECALENTADO!','#FF6B6B',{size:11});}break;
    case'megafonio':if(e.abT<=0){e.abT=5;for(let i=0;i<2;i++)spawnEnemy('practicante',e.pi,G.hpMulNow,Math.max(0,e.d-8-i*16));addText(e.x,e.y-40,'¡Más practicantes!','#FFE066',{size:11});}break;

      if(e.phase>1&&e.t2<=0){e.t2=9;e.hidden=2.2;e.burrowTo=Math.min(e.path.len-70,e.d+2.2*T);burst(e.x,e.y,20,'#8B5A2B');addText(e.x,e.y-50,'¡Se fue por debajo!','#FFE066');}
      break;

      if(e.t1<=0){e.t1=e.phase>1?1.6:2.2;const ds=defsNear(e.x,e.y,3*T).slice(0,e.phase>1?3:2);ds.forEach(d=>enemyShot(e,d,13));if(ds.length)sfx('paper');}

      break;

      if(e.t2<=0){e.t2=8;const ds=defsNear(e.x,e.y,3.2*T).filter(d=>d.disabled<=0).slice(0,2);ds.forEach(d=>disableDef(d,3));if(ds.length){addText(e.x,e.y-95,'¡Les tengo una propuesta!','#FFE066',{size:13});sfx('disable');}}
      if(e.phase>=2){e.t3-=h;e.t4-=h;if(e.t3<=0){e.t3=9;spawnEnemy(pick(['servidor','coimarron','leguleyo']),ri(0,G.paths.length-1),G.hpMulNow,0);}if(e.t4<=0&&e.shield<=0){e.t4=12;e.shield=Math.round(e.maxhp*0.08);addText(e.x,e.y-95,'¡Escudo de promesas!','#9BE7FF',{size:13});}}
      if(e.phase>=3){e.t5-=h;if(e.t5<=0){e.t5=5;pollute(0,0,0);pollute(0,0,0);G.shake=0.25;G.fx.push({type:'confetti',x:e.x,y:e.y-40,t:0,dur:1.2});}}

function onPhase(e){
  switch(e.type){
    case'tramitador':e.spdMul=1.25;e.t2=1;break;
    case'draga':e.t2=2;break;
    case'demandon':e.t2=0;break;

function reachLake(e){

  if(e.boss){e.pi=ri(0,G.paths.length-1);e.path=G.paths[e.pi];e.d=0;const pp=posAt(e.path,0);e.x=pp.x;e.y=pp.y;addText(LAKE.x,LAKE.y+40,'¡Vuelve a la carga por otro camino!','#FFE066',{size:13});}
  else e.dead=true;

/* ---------- oleadas ---------- */
function weightedPick(pool){let tot=0;const w=pool.map(t=>{const v=6/(EN[t].cost+3);tot+=v;return v;});let r=Math.random()*tot;for(let i=0;i<pool.length;i++){r-=w[i];if(r<=0)return pool[i];}return pool[pool.length-1];}
function buildWave(){
  const w=G.wave,q=[];let pool,budget,hpM,boss=null,bossHp=1;
  if(G.mode==='story'){const L=G.li,lv=G.lv;pool=lv.pool.filter(t=>w>=3||EN[t].cost<20||lv.newE.includes(t));budget=Math.round((26+w*22)*(1+L*0.25)+L*8);hpM=1+L*0.1+(w-1)*0.065;
    if(w===G.totalWaves){boss=lv.boss;budget=Math.round(budget*0.55);}
    if(w===1&&L>0)lv.newE.forEach(t=>{q.push(t);budget-=EN[t].cost;});
  }else{const n=Math.min(FREE_ORDER.length,2+Math.floor((w-1)/2));pool=FREE_ORDER.slice(0,n);budget=Math.round(30+w*27+w*w*1.1);hpM=1+(w-1)*0.1+Math.max(0,w-15)*0.06;
    if(w%8===0){boss=BOSS_ORDER[(w/8-1)%5];bossHp=0.45+w*0.035;budget=Math.round(budget*0.5);}}
  budget=Math.round(budget*Math.min(1,0.5+0.14*w));
  while(budget>0){const t=weightedPick(pool);q.push(t);budget-=EN[t].cost;}
  shuffle(q);G.hpMulNow=hpM;
  let t=1;const list=[];
  q.forEach(type=>{list.push({t,type,pi:ri(0,G.paths.length-1),hpM});t+=type==='practicante'?0.5:rnd(0.85,1.35);});
  if(boss)list.push({t:Math.max(5,t*0.4),type:boss,pi:ri(0,G.paths.length-1),hpM:bossHp});
  list.sort((a,b)=>a.t-b.t);return list;
}
function startWave(early){

function waveCleared(){

function winLevel(){

function lose(){

function addText(x,y,s,col,o){o=o||{};G.texts.push({x,y,s,col,t:0,dur:o.dur||1.2,size:o.size||12,bubble:o.bubble,follow:o.follow});}

/* ---------- actualización ---------- */
function stepGame(dt){const n=Math.max(1,Math.ceil(dt/0.017));const h=dt/n;for(let i=0;i<n;i++)update(h);}
function update(h){
  G.time+=h;if(G.shake>0)G.shake-=h;
  if(G.announce){G.announce.t+=h;if(G.announce.t>G.announce.dur)G.announce=null;}
  if(G.banner){G.banner.t+=h;if(G.banner.t>G.banner.dur)G.banner=null;}
  if(G.ended){G.endT-=h;if(G.endT<=0&&G.endFn){const f=G.endFn;G.endFn=null;f();}}
  else{
    if(G.between){G.countdown-=h;if(G.countdown<=0)startWave(false);}
    else{G.spawnT+=h;while(G.spawnQ.length&&G.spawnQ[0].t<=G.spawnT){const s=G.spawnQ.shift();spawnEnemy(s.type,s.pi,s.hpM,0);}
      if(!G.spawnQ.length&&!G.enemies.some(e=>!e.dead))waveCleared();}
    if(G.wave>=1){G.eventT-=h;if(G.eventT<=0){G.eventT=rnd(15,24);legendEvent();}}
    if(G.apuCharge<G.apuMax)G.apuCharge=Math.min(G.apuMax,G.apuCharge+h);
    if(G.buffAtk>0)G.buffAtk-=h;
    if(G.obst.some(o=>o.kind==='pishtaco')){G.coinDrain+=h;if(G.coinDrain>=1){G.coinDrain=0;if(G.coins>0)G.coins--;}}
    for(const d of G.defs)updDef(d,h);
    for(const e of G.enemies)if(!e.dead)updEnemy(e,h);
    G.enemies=G.enemies.filter(e=>!e.dead);
  }
  for(const p of G.projs)updProj(p,h);G.projs=G.projs.filter(p=>!p.dead);
  for(const f of G.fx){f.t+=h;if(f.type==='part'){f.x+=f.vx*h;f.y+=f.vy*h;f.vy+=220*h;}}G.fx=G.fx.filter(f=>f.t<f.dur);
  for(const t of G.texts)t.t+=h;G.texts=G.texts.filter(t=>t.t<t.dur);
  for(const k of G.tokens)k.t+=h;G.tokens=G.tokens.filter(k=>k.t<k.life);
  for(const o of G.obst){o.t+=h;if(o.shakeT>0)o.shakeT-=h;}G.obst=G.obst.filter(o=>o.t<o.life);
}
function updProj(p,h){
  if(p.arc){p.t+=h;const f=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*f;p.y=p.sy+(p.ty-p.sy)*f;p.z=Math.sin(f*Math.PI)*p.h;if(f>=1)impact(p);return;}
  if(p.home&&p.target&&!p.target.dead&&!(p.target.hidden>0)){p.tx=p.target.x;p.ty=p.target.y-p.target.size*0.6;}
  if(p.tdef){p.tx=p.tdef.x;p.ty=p.tdef.y-10;}
  const dx=p.tx-p.x,dy=p.ty-p.y,dd=Math.hypot(dx,dy),st=p.spd*h;
  if(dd<=st+2){p.x=p.tx;p.y=p.ty;impact(p);}else{p.x+=dx/dd*st;p.y+=dy/dd*st;}
}
function applySlow(e,f,dur){if(e.boss)f=1-(1-f)*0.5;e.slowF=e.slowT>0?Math.min(e.slowF,f):f;e.slowT=Math.max(e.slowT,dur);}
function impact(p){
  p.dead=true;
  switch(p.kind){
    case'stone':if(p.target&&!p.target.dead){hurt(p.target,p.dmg);sfx('hit');}break;
    case'yarn':{const hits=p.aoe?G.enemies.filter(e=>!e.dead&&dist(e.x,e.y,p.x,p.y)<=p.aoe):(p.target&&!p.target.dead?[p.target]:[]);hits.forEach(e=>{hurt(e,p.dmg);applySlow(e,p.slow,p.slowDur);});G.fx.push({type:'ring',x:p.x,y:p.y,t:0,dur:0.35,r0:3,r1:p.aoe||14,col:'255,143,171'});break;}
    case'pot':{G.enemies.filter(e=>!e.dead&&dist(e.x,e.y,p.tx,p.ty)<=p.aoe+e.size*0.4).forEach(e=>{hurt(e,p.dmg);if(p.burn)e.burn=3;});G.fx.push({type:'ring',x:p.tx,y:p.ty,t:0,dur:0.45,r0:6,r1:p.aoe,col:'224,60,49'});burst(p.tx,p.ty,10,'#E03C31');burst(p.tx,p.ty,6,'#F77F00');sfx('boom');break;}
    case'paper':if(p.tdef&&G.defs.includes(p.tdef))hurtDef(p.tdef,p.dmg);break;
  }
}

function drawFX(f,t){

    case'slash':X.strokeStyle='rgba(255,255,255,'+(1-p).toFixed(2)+')';X.lineWidth=3;X.beginPath();X.arc(f.x,f.y,14,-1.2+p*2,0.4+p*2);X.stroke();break;

    case'bolt':{X.strokeStyle='rgba(255,230,100,'+(1-p).toFixed(2)+')';X.lineWidth=4;X.beginPath();let x=f.x+rnd(-20,20),y=BY;X.moveTo(x,y);while(y<f.y){y+=24;x+=rnd(-14,14);X.lineTo(y>f.y?f.x:x,Math.min(y,f.y));}X.stroke();circ(f.x,f.y,12*(1-p),'rgba(255,255,200,.8)');break;}
    case'snake':{const pth=G.paths[f.pi];const hd=pth.len*(1-p);for(let i=14;i>=0;i--){const q=posAt(pth,Math.min(pth.len,hd+i*12));const wv=Math.sin(t*10+i*0.8)*6;circ(q.x+wv*(q.dy?1:0),q.y+wv*(q.dx?1:0),14-i*0.5,i%2?'#2D6A4F':'#40916C');}const h=posAt(pth,hd);circ(h.x,h.y,15,'#52B788','#1B4332',2);circ(h.x-5,h.y-4,2.5,'#fff');circ(h.x+5,h.y-4,2.5,'#fff');break;}
    case'rain':X.strokeStyle='rgba(144,224,239,'+(0.7*(1-p)).toFixed(2)+')';X.lineWidth=1.5;for(let i=0;i<70;i++){const x=(i*53+t*400)%BW,y=BY+((i*97+t*700)%BH);line(x,y,x-4,y+12,X.strokeStyle,1.5);}break;

    case'smoke':for(let i=0;i<10;i++){const a=i/10*Math.PI*2;circ(f.x+Math.cos(a)*f.r*p,f.y+Math.sin(a)*f.r*p*0.6,14+p*10,'rgba(120,120,120,'+(0.5*(1-p)).toFixed(2)+')');}break;

  }

function drawProj(p,t){

    drawWoman(ix+22,cy+40,G.placeType,0,{t:now,sc:1.25});txt(b.short,ix+50,cy+18,14,'#3C1F5A');wrapTxt(b.name,ix+50,cy+35,iw-52,11,'#7B3F00','left',13);
    let yy=cy+76;yy+=wrapTxt(b.role,ix,yy,iw,11,'#3C1F5A','left',14);yy+=6;
    const row=(a,b2)=>{txt(a,ix,yy,11,'#555');txt(b2,ix+iw,yy,11,'#3C1F5A','right');yy+=15;};
    row('Costo',b.cost+' monedas');row('Alcance',b.range.toFixed(1)+' casillas');row(G.placeType==='chamana'?'Cura cada':'Ataque cada',b.rate.toFixed(1)+' s');row('Vida',String(b.hp));

    wrapTxt('Toca una casilla de pasto para colocarla.',ix,cy+ch-30,iw,11,'#2B9348','left',13);
  }else{
    txt('Cómo defender',ix,cy+16,14,'#3C1F5A');
    let yy=cy+36;['1. Elige una defensora abajo.','2. Tócala en una casilla de pasto.','3. Toca a una defensora para mejorarla.','4. Toca lo que brilla en la laguna.','5. Espanta sombras y lodo con 3 toques.'].forEach(s=>{yy+=wrapTxt(s,ix,yy,iw,11,'#4E2A6E','left',13)+3;});
    if(G.buffAtk>0)txt('¡Fuerza de ukuku activa!',ix,cy+ch-20,11,'#9C6644');

}

/* ---------- entrada ---------- */
function toLogical(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();if(screen==='menu'&&!curSong)playSong('menu');const p=toLogical(ev);mouse=p;onTap(p.x,p.y);});
cv.addEventListener('pointermove',ev=>{mouse=toLogical(ev);});
cv.addEventListener('pointerleave',()=>{mouse={x:-1,y:-1};});
cv.addEventListener('contextmenu',ev=>{ev.preventDefault();if(G)G.placeType=null;});
function onTap(x,y){
  if(fade.dir!==0)return;
  for(let i=buttons.length-1;i>=0;i--){const b=buttons[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){if(!b.dis){sfx('click');b.fn();}return;}}
  if(screen==='play'&&G)boardTap(x,y);
}
function boardTap(x,y){
  if(G.paused||G.ended)return;
  for(const k of G.tokens)if(dist(x,y,k.x,k.y)<30){useToken(k);return;}
  if(x<0||x>=BW||y<BY||y>=BY+BH)return;
  const c=Math.floor(x/T),r=Math.floor((y-BY)/T);
  const o=G.obst.find(o=>o.c===c&&o.r===r);if(o){tapObst(o);return;}
  const d=G.defs.find(d=>d.c===c&&d.r===r);if(d){G.sel=d;G.placeType=null;return;}
  if(G.placeType){
    if(G.grid[c][r]!==0){addText(x,y,G.grid[c][r]===2?'¡En la laguna no!':'El sendero debe quedar libre','#fff');sfx('bad');return;}
    const cost=DEF[G.placeType].cost;if(G.coins<cost){addText(x,y,'Faltan monedas','#FFD23F');sfx('bad');return;}
    placeDef(G.placeType,c,r);return;
  }
  G.sel=null;
}
addEventListener('keydown',ev=>{
  initAudio();
  if(screen!=='play'||!G||G.ended)return;
  const k=ev.key.toLowerCase();
  if(k>='1'&&k<='5'){const t=DEF_ORDER[+k-1];if(G.allowed.includes(t)){G.placeType=G.placeType===t?null:t;G.sel=null;}}
  else if(k==='a')useApu();
  else if(k===' '){G.paused=!G.paused;ev.preventDefault();}
  else if(k==='f')G.speed=G.speed%3+1;
  else if(k==='escape'){G.placeType=null;G.sel=null;}
  else if(k==='u'&&G.sel)upgradeDef(G.sel);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&screen==='play'&&!G.ended)G.paused=true;});

/* ---------- bucle principal ---------- */
let last=performance.now();
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000));last=ts;now+=dt;
  X.setTransform(K,0,0,K,0,0);buttons=[];
  try{
    if(screen==='play'&&G){if(!G.paused)stepGame(dt*G.speed);if(screen==='play')renderGame(true);else renderScreen();}
    else renderScreen();
  }catch(err){console.error(err);}
  if(fade.dir===1){fade.a+=dt*3.2;if(fade.a>=1){fade.a=1;const f=fade.next;fade.next=null;fade.dir=-1;try{f&&f();}catch(e){console.error(e);}}}
  else if(fade.dir===-1){fade.a-=dt*3.2;if(fade.a<=0){fade.a=0;fade.dir=0;}}
  if(fade.a>0){X.setTransform(K,0,0,K,0,0);X.fillStyle='rgba(27,21,48,'+fade.a.toFixed(3)+')';X.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.MR={newGame,update,startWave,placeDef,upgradeDef,useApu,useToken,tapObst,get G(){return G;},set screen(s){screen=s;},get screen(){return screen;},renderGame,renderScreen,DEF,EN,LEVELS,MAPS,defStats,upCost,legendEvent};
